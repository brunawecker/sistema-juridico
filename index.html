<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Jurídico Operacional</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#447F98;--navy-lt:#629BB5;--ice:#D6E8F3;--glacier:#B9D8E1;
  --dani:#2C6E8A;--dani-lt:#E0F2F7;--red:#C0392B;--red-lt:#FDEDEC;
  --amber:#D68910;--amber-lt:#FEF9E7;--green:#1E8449;--green-lt:#E9F7EF;
  --roxo:#7B2D8B;--gray:#607D8B;--gray-lt:#F0F5F8;--border:#CBE0EA;--text:#1A2E38;
  --bg:#EEF6FA;--sw:230px;--r:14px;
  --sh:0 2px 8px rgba(68,127,152,.1),0 8px 24px rgba(68,127,152,.06);
  --sh2:0 4px 16px rgba(68,127,152,.15),0 12px 40px rgba(68,127,152,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
/* 👑 REINADO: o coroado da semana vê o sistema INTEIRO em tons dourados */
body.reinado{--navy:#8A6D1C;--navy-lt:#B08D2E;--ice:#F7EFD8;--glacier:#EAD9A8;
  --dani:#7A5E14;--dani-lt:#FBF4DF;--gray:#8A7A4A;--gray-lt:#F7F3E6;
  --border:#E6D9AE;--bg:#FBF7EA;
  --sh:0 2px 8px rgba(138,109,28,.12),0 8px 24px rgba(138,109,28,.08);
  --sh2:0 4px 16px rgba(138,109,28,.18),0 12px 40px rgba(138,109,28,.12)}
body.reinado .sb{background:linear-gradient(170deg,#6E5410 0%,#8A6D1C 50%,#B08D2E 100%)}
body.reinado .tc{background:linear-gradient(135deg,#FFFDF6 0%,#FBF5E3 100%)}
body.reinado .sc{background:linear-gradient(135deg,#FFFDF6,#FBF4DF)}
body.reinado .btp{background:linear-gradient(135deg,#8A6D1C,#B08D2E);box-shadow:0 4px 15px rgba(138,109,28,.35)}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
/* LOGIN */
#tela-login{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#2C6E8A 0%,#447F98 40%,#629BB5 70%,#B9D8E1 100%)}
.lc{background:rgba(255,255,255,.97);border-radius:22px;padding:44px 38px;width:370px;
  box-shadow:0 24px 80px rgba(44,110,138,.3)}
.ll{font-size:10px;font-weight:700;color:var(--navy);letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px}
.lt{font-size:25px;font-weight:700;color:var(--navy);margin-bottom:3px}
.ls2{font-size:13px;color:var(--gray);margin-bottom:24px}
.btn{padding:9px 15px;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:13px;
  font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btp{background:linear-gradient(135deg,var(--navy),var(--navy-lt));color:white;box-shadow:0 4px 15px rgba(68,127,152,.35)}
.btp:hover{filter:brightness(1.06)}
.bts{background:white;color:var(--navy);border:1px solid var(--border)}.bts:hover{background:var(--gray-lt)}
.btg{background:var(--green);color:white}.btr{background:var(--red);color:white}.btx{background:var(--roxo);color:white}
.btw{width:100%}.btsm{padding:6px 11px;font-size:12px}
.fi{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:9px;
  font-family:'DM Sans',sans-serif;font-size:14px;background:white;margin-bottom:9px}
.fi:focus,.fsel:focus,.fta:focus{outline:none;border-color:var(--navy)}
.aviso{font-size:12px;border-radius:9px;padding:9px 12px;margin-top:12px;line-height:1.5}
.aviso.erro{background:var(--red-lt);color:var(--red)}.aviso.info{background:var(--ice);color:var(--dani)}
.separa{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--gray);font-size:11px}
.separa::before,.separa::after{content:"";flex:1;height:1px;background:var(--border)}
/* SHELL com sidebar */
#app{display:none}
.sb{position:fixed;top:0;left:0;height:100vh;width:var(--sw);color:white;display:flex;flex-direction:column;
  z-index:100;background:linear-gradient(170deg,#2C6E8A 0%,#447F98 50%,#5A90A8 100%);transition:transform .25s}
.sbh{padding:15px 15px 12px;border-bottom:1px solid rgba(255,255,255,.12)}
.sbl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.55}
.sbt{font-size:14px;font-weight:700}
.sbu{padding:11px 15px;display:flex;align-items:center;gap:9px;border-bottom:1px solid rgba(255,255,255,.12)}
.sbav{width:31px;height:31px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.sbnm{font-size:13px;font-weight:600;line-height:1.2}.sbrl{font-size:10px;opacity:.6}
.sbn{flex:1;padding:8px 8px;display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.ni{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:12.5px;
  font-weight:500;cursor:pointer;color:rgba(255,255,255,.72);border:none;background:none;
  width:100%;text-align:left;transition:all .12s}
.ni:hover{background:rgba(255,255,255,.1);color:white}
.ni.on{background:rgba(255,255,255,.18);color:white;font-weight:600}
.ni-i{width:17px;text-align:center;flex-shrink:0}
.sbf{padding:10px 15px;border-top:1px solid rgba(255,255,255,.12);font-size:10px;opacity:.4}
.mn{margin-left:var(--sw);min-height:100vh}
.tb{background:white;border-bottom:1px solid var(--border);padding:0 18px;height:52px;display:flex;
  align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:8px}
.tbt{font-size:15px;font-weight:700;color:var(--navy)}
.ct{padding:16px 18px 60px;max-width:1080px}
.faixa{background:var(--roxo);color:white;border-radius:10px;padding:8px 14px;font-size:12.5px;
  font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.mbb{display:none;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);
  background:white;cursor:pointer;font-size:15px}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:90;display:none}.ovl.on{display:block}
/* STATS */
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:4px 0 16px}
.sc{background:linear-gradient(135deg,white,#F4FAFC);border-radius:var(--r);padding:12px 14px;
  border:1px solid var(--border);box-shadow:var(--sh)}
.sl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--gray);margin-bottom:4px}
.sv{font-size:22px;font-weight:700;color:var(--navy);line-height:1}
.sv.red{color:var(--red)}.sv.green{color:var(--green)}.sv.amber{color:var(--amber)}
.sv.pq{font-size:16px}
/* CARDS de tarefa */
.grupo-t{font-size:11px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.07em;
  margin:16px 0 8px;display:flex;justify-content:space-between}
.grupo-t .qt{color:var(--gray);font-weight:500;text-transform:none;letter-spacing:0}
.tc{background:linear-gradient(135deg,white 0%,#F7FBFD 100%);border-radius:var(--r);padding:11px 14px;
  border:1px solid var(--border);border-left:4px solid transparent;box-shadow:var(--sh);cursor:pointer;
  transition:all .15s;display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.tc:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.tc.u1{border-left-color:var(--red)}.tc.u2{border-left-color:var(--amber)}
.tc.u3{border-left-color:#3B82F6}.tc.u4{border-left-color:#8B5CF6}.tc.u5{border-left-color:var(--glacier)}
.tcc{font-size:13px;font-weight:600;color:var(--navy)}
.tcm{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
.tco{font-size:11px;color:var(--gray)}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase}
.ti{background:var(--red-lt);color:var(--red)}.td2{background:var(--amber-lt);color:var(--amber)}
.ts{background:#EDE9FE;color:#7C3AED}.tm{background:var(--gray-lt);color:var(--gray)}
.tek{background:var(--green-lt);color:var(--green)}
.tda{background:var(--dani-lt);color:var(--dani)}
.tdy{font-size:11px;font-family:'DM Mono',monospace;margin-left:auto;white-space:nowrap}
.tdy.ov{color:var(--red);font-weight:600}.tdy.ok{color:var(--green)}
.vazio{text-align:center;padding:38px 16px;color:var(--gray)}
.carregando{display:flex;justify-content:center;padding:40px}
.spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
/* filtros / tabelas */
.flr{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.si{padding:7px 11px;border:1px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;
  font-size:13px;background:white;flex:1;min-width:150px}
.fsel{padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;
  font-size:12px;background:white;cursor:pointer}
.painel{background:white;border-radius:var(--r);border:1px solid var(--border);padding:13px 15px;box-shadow:var(--sh);margin-bottom:14px}
.barra{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.barra .nm{font-size:12px;font-weight:600;width:88px;flex-shrink:0}
.barra .tk{flex:1;height:6px;background:var(--gray-lt);border-radius:3px;overflow:hidden}
.barra .fl{height:100%;border-radius:3px}
.barra .vl{font-size:12px;font-weight:700;width:34px;text-align:right}
.linha-item{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--gray-lt);font-size:12.5px}
.det{background:white;border:1px solid var(--border);border-radius:10px;margin-bottom:7px;overflow:hidden}
.det summary{cursor:pointer;list-style:none;padding:11px 14px;display:flex;align-items:center;gap:9px}
.det summary::-webkit-details-marker{display:none}
.cap{height:9px;background:var(--gray-lt);border-radius:5px;overflow:hidden;margin:5px 0}
.cap>div{height:100%;border-radius:5px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cald{min-height:78px;border:1px solid var(--border);border-radius:9px;padding:5px;background:white;font-size:9px;cursor:pointer}
.cald.hoje{border:2px solid var(--navy);background:var(--dani-lt)}
.cald.fora{background:#FAFBFC;opacity:.5}
.calpin{background:var(--ice);border-left:2px solid var(--navy);border-radius:3px;padding:1px 4px;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* MODAL */
.mfundo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:14px}
.mfundo.aberto{display:flex}
.mcaixa{background:white;border-radius:18px;width:100%;max-width:620px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(44,110,138,.3)}
.mtopo{padding:15px 17px 11px;border-bottom:1px solid var(--border);position:sticky;top:0;background:white;display:flex;justify-content:space-between;gap:10px;z-index:1}
.mtit{font-size:15px;font-weight:700;color:var(--navy)}.msub{font-size:11px;color:var(--gray);margin-top:2px}
.mfecha{width:28px;height:28px;border-radius:50%;border:none;background:var(--gray-lt);cursor:pointer;font-size:14px;flex-shrink:0}
.mcorpo{padding:14px 17px}
.bloco{margin-bottom:15px}
.bloco-t{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gray);margin-bottom:7px}
.dados{background:var(--ice);border:1px solid var(--glacier);border-radius:10px;padding:10px 13px;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12px}
.dados b{color:var(--navy)}
.timerbox{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:9px;padding:9px 13px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.timernum{font-family:'DM Mono',monospace;font-size:21px;font-weight:700;color:#15803D}
.fta{width:100%;min-height:60px;padding:9px 11px;border:1px solid var(--border);border-radius:9px;font-family:'DM Sans',sans-serif;font-size:13px;resize:vertical}
.linha-acao{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;align-items:center}
.hentrada{display:flex;gap:9px;margin-bottom:9px}
.hbola{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px;background:var(--green)}
.hbola.sup{background:var(--dani)}.hbola.enc{background:var(--roxo)}
.hmeta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
.hautor{font-size:11px;font-weight:700;color:var(--navy)}
.hdata{font-size:11px;color:var(--gray);font-family:'DM Mono',monospace}
.htipo{font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--gray-lt);color:var(--gray)}
.htexto{font-size:13px;line-height:1.5;white-space:pre-line}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);
  color:white;padding:10px 17px;border-radius:9px;font-size:13px;font-weight:500;z-index:9999;opacity:0;
  transition:all .25s;pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,.25)}
#toast.mostra{transform:translateX(-50%);opacity:1}
#toast.ok{background:var(--green)}#toast.erro{background:var(--red)}
@media(max-width:820px){:root{--sw:0px}.sb{transform:translateX(-240px);width:240px}.sb.on{transform:translateX(0)}.mbb{display:flex}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="tela-login">
  <div class="lc">
    <div class="ll">Villela Advogados</div>
    <div class="lt">Sistema Jurídico</div>
    <div class="ls2">Operacional &amp; Gestão de Tarefas</div>
    <div id="login-corpo">
      <button class="btn btp btw" onclick="entrarGoogle()">Entrar com Google</button>
      <div class="separa">ou com e-mail e senha</div>
      <input class="fi" id="li-email" type="email" placeholder="Seu e-mail" autocomplete="email">
      <input class="fi" id="li-senha" type="password" placeholder="Senha" autocomplete="current-password">
      <button class="btn bts btw" onclick="entrarSenha()">Entrar</button>
      <button class="btn bts btw" style="margin-top:7px" onclick="criarSenha()">Primeiro acesso — criar senha</button>
    </div>
    <div id="login-aviso"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="ovl" id="ovl" onclick="fecharMenu()"></div>
  <aside class="sb" id="sb">
    <div class="sbh"><div class="sbl">Villela Advogados</div><div class="sbt">Sistema Jurídico</div></div>
    <div class="sbu"><div class="sbav" id="sb-av">?</div>
      <div><div class="sbnm" id="sb-nm">—</div><div class="sbrl" id="sb-rl">—</div></div></div>
    <nav class="sbn" id="sb-nav"></nav>
    <div class="sbf">Sistema novo · em testes</div>
  </aside>
  <div class="mn">
    <div class="tb">
      <div style="display:flex;align-items:center;gap:9px">
        <button class="mbb" onclick="abrirMenu()">&#9776;</button>
        <span class="tbt" id="tbt">—</span>
      </div>
      <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">
        <span id="chip-timer" style="display:none;background:#F0FDF4;border:1px solid #BBF7D0;
          border-radius:16px;padding:4px 12px;font-size:12px;color:#15803D;font-weight:600;
          cursor:pointer" onclick="pararAvulsa()" title="Clique para encerrar e salvar o tempo">
          &#9201; <span id="chip-timer-desc"></span> <span id="chip-timer-num" style="font-family:'DM Mono'">0:00</span> &#9632;</span>
        <span id="area-vercomo"></span>
        <button class="btn bts btsm" onclick="recarregar()">&#8635;</button>
        <button class="btn bts btsm" onclick="sair()">Sair</button>
      </div>
    </div>
    <div class="ct">
      <div id="faixa-vercomo"></div>
      <div id="conteudo"><div class="carregando"><div class="spin"></div></div></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="mfundo" id="modal"><div class="mcaixa">
  <div class="mtopo"><div><div class="mtit" id="m-titulo">—</div><div class="msub" id="m-sub">—</div></div>
    <button class="mfecha" title="Minimizar — navegue pelo sistema com o cartão aberto e o relógio contando" onclick="minimizarCartao()">&#8213;</button>
    <button class="mfecha" onclick="fecharModal()">&#10005;</button></div>
  <div class="mcorpo" id="m-corpo"></div>
</div></div>

<!-- MODAL 2 (sobreposto: correção, encerrar, delegar...) -->
<div id="dock-cartao" style="display:none;position:fixed;left:14px;bottom:14px;z-index:180;background:var(--dani);color:white;border-radius:12px;padding:9px 13px;box-shadow:0 8px 26px rgba(0,0,0,.35);cursor:pointer;max-width:320px" onclick="reabrirCartao()">
  <div style="display:flex;align-items:center;gap:9px">
    <span style="font-family:'DM Mono';font-weight:700" id="dock-tempo">0:00</span>
    <span id="dock-nome" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">—</span>
    <button onclick="event.stopPropagation();fecharDock()" style="background:rgba(255,255,255,.2);border:0;color:white;border-radius:7px;padding:2px 8px;cursor:pointer">&#10005;</button></div>
  <div style="font-size:10px;opacity:.8;margin-top:2px">&#9201; relógio contando — toque para reabrir o cartão</div></div>
<div class="mfundo" id="modal2" style="z-index:300"><div class="mcaixa" style="max-width:520px">
  <div class="mtopo"><div><div class="mtit" id="m2-titulo">—</div><div class="msub" id="m2-sub">—</div></div>
    <button class="mfecha" onclick="if(!modalTemTexto('modal2')||confirm('Há texto não salvo (fica guardado como rascunho). Fechar mesmo assim?'))fecharModal2()">&#10005;</button></div>
  <div class="mcorpo" id="m2-corpo"></div>
</div></div>

<!-- FAB: criar novo -->
<div id="fab-area" style="position:fixed;bottom:22px;right:22px;z-index:150;display:none;
  flex-direction:column;align-items:flex-end;gap:7px">
  <div id="fab-menu" style="display:none;flex-direction:column;gap:5px;align-items:flex-end"></div>
  <button id="fab-btn" onclick="toggleFab()" style="width:52px;height:52px;border-radius:50%;
    background:var(--navy);color:white;border:none;font-size:24px;cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.25)">+</button>
</div>

<div id="toast"></div>

<script>
"use strict";
// ================================================================= BASE
const MODO_SUPABASE = !!(window.CONFIG && CONFIG.SUPABASE_ANON_KEY);
const supa = MODO_SUPABASE ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;
const E = { perfil:null, emailTeste:null, view:null, tarefas:[], atual:null,
            timerIni:null, timerInt:null, equipe:[], cacheCli:null };

const ge=id=>document.getElementById(id), ce=t=>document.createElement(t);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function toast(m,t){const e=ge("toast");e.textContent=m;e.className="mostra "+(t||"");setTimeout(()=>e.className="",3200);}
// data de HOJE no fuso local (nunca toISOString aqui: é UTC e vira "amanhã" depois das 21h)
function hojeISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function brData(iso){if(!iso)return"";const p=String(iso).slice(0,10).split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:String(iso);}

// ===== Robô de produtividade: tempos REAIS medidos por pessoa + tipo =====
// Soma as sessões da mesma tarefa no mesmo dia (1 execução) e tira a mediana.
async function carregarTemposReais(ops){
  if(E._tReal)return;
  let hist=[];try{hist=await DB.historicoTimers(120);}catch(e){hist=[];}
  const opDe={};(ops||[]).forEach(t=>{if(t.id_tarefa)opDe[t.id_tarefa]=t.operacao||"";});
  const exec={};
  (hist||[]).forEach(r=>{if(r.tipo!=="TIMER")return;
    const m=parseInt((String(r.texto||"").match(/(\d+)\s*min/)||[0,0])[1]);if(!m)return;
    const a=loginDe(r.autor),op=opDe[r.id_tarefa];if(!a||!op)return;
    const k=a+"|"+op+"|"+r.id_tarefa+"|"+String(r.data_dt||"").slice(0,10);
    exec[k]=(exec[k]||0)+m;});
  const porPar={},porOp={};
  Object.entries(exec).forEach(([k,min])=>{const p=k.split("|");
    (porPar[p[0]+"|"+p[1]]=porPar[p[0]+"|"+p[1]]||[]).push(min);
    (porOp[p[1]]=porOp[p[1]]||[]).push(min);});
  const med=v=>{v.sort((a,b)=>a-b);return v[Math.floor(v.length/2)];};
  E._tReal={};E._tRealN={};E._tRealOp={};E._tRealOpN={};
  Object.entries(porPar).forEach(([k,v])=>{E._tRealN[k]=v.length;if(v.length>=5)E._tReal[k]=med(v);});
  Object.entries(porOp).forEach(([k,v])=>{E._tRealOpN[k]=v.length;if(v.length>=5)E._tRealOp[k]=med(v);});
}
// tempo para PLANEJAR o dia: mediana real (pessoa → equipe), mas nunca menor
// que metade do padrão — o cronômetro só vê o trabalho dentro do site.
function tempoPlanoDe(assessor,op){
  const a=loginDe(assessor||"");
  const tr=(E._tReal||{})[a+"|"+op]||(E._tRealOp||{})[op];
  if(!tr)return tempoDe(op);
  return Math.max(Math.round(tempoDe(op)/2),Math.min(tr,tempoDe(op)*3));
}

// 2 voto do time, 3 valor, 4 volume; 5ª semana volta à operação
function coroaCriterio(){
  const hj=new Date();const semanaMes=Math.floor((hj.getDate()-1)/7)+1;
  const crit=[1,2,3,4,1][Math.min(semanaMes,5)-1];
  const C={1:["OPERAÇÃO","mais tarefas concluídas na semana",r=>+r.conclusoes||0,r=>(r.conclusoes||0)+" concluída(s)"],
    2:["TIME","voto da equipe — apurado na sexta",()=>0,()=>"votação na sexta"],
    3:["FATURAMENTO POR VALOR","maior valor em contratos novos pagos",r=>+r.valor_novos||0,r=>fmtR$(+r.valor_novos||0)],
    4:["FATURAMENTO POR VOLUME","mais contratos novos pagos",r=>+r.novos||0,r=>(r.novos||0)+" contrato(s)"]}[crit];
  return {semanaMes,crit,rotulo:C[0],desc:C[1],medir:C[2],fmt:C[3]};
}

// quem lidera a coroa vê o PRÓPRIO sistema coroado em dourado
async function coroaViva(){
  try{
    const eu=E.perfil.nome_sistema;
    const nm=ge("sb-nm"),av=ge("sb-av");
    // 1º) REINANTE da semana (coroado na sexta): dourado VIVO a semana toda
    let reinado=null;try{reinado=await DB.coroaAtual();}catch(e){}
    if(reinado&&reinado.pessoa===eu){
      document.body.classList.add("reinado");   // sistema INTEIRO dourado
      if(nm){nm.innerHTML="&#128081; "+esc(eu);nm.style.color="#FFD966";
        nm.title="Você é o(a) COROADO(A) da semana — o dourado é seu até sexta!";}
      if(av){av.style.background="linear-gradient(135deg,#FFD966,#E0A800)";
        av.style.color="#5A4500";av.style.boxShadow="0 0 0 3px #FFD966";}
      return;}
    document.body.classList.remove("reinado");
    // 2º) líder da corrida ATUAL: dourado suave (está perto, mas ainda não é rei)
    const pl=await DB.placar();if(!(pl||[]).length)return;
    const cc=coroaCriterio();if(cc.crit===2)return;
    const ord=[...pl].sort((a,b)=>cc.medir(b)-cc.medir(a)||(+b.valor_novos)-(+a.valor_novos));
    if(!ord[0]||cc.medir(ord[0])<=0)return;
    if(ord[0].pessoa!==eu)return;
    // líder da corrida (suspense): nome dourado + coroinha NA INICIAL —
    // o resto do sistema continua normal; dourado total é só do coroado
    if(nm){nm.textContent=eu;nm.style.color="#FFD966";
      nm.title="Você está na FRENTE da corrida da coroa ("+cc.rotulo+") — fecha forte até sexta 15h!";}
    if(av){av.style.position="relative";av.style.boxShadow="0 0 0 3px #EBD9A5";
      av.innerHTML=esc(String(eu||"?").charAt(0))+'<span style="position:absolute;top:-9px;right:-6px;font-size:12px">&#128081;</span>';}
  }catch(e){}
}

// Traduz as mensagens técnicas do banco para algo que dá para entender.
// Mensagens já em português (das nossas funções/travas) passam intactas.
function traduzErro(m){const s=String(m||"");
  if(/jwt|token.*expired|invalid claim/i.test(s))return "Sua sessão expirou. Recarregue a página e entre de novo.";
  if(/failed to fetch|networkerror|load failed|network request/i.test(s))return "Sem conexão com o banco. Confira a internet e tente de novo.";
  if(/row-level security|violates row|permission denied/i.test(s))return "Você não tem permissão para essa ação.";
  if(/duplicate key/i.test(s))return "Já existe um registro com esse código.";
  if(/violates check constraint/i.test(s))return "Valor fora do padrão aceito — confira o preenchimento.";
  return s;}

    data:brHoje(),data_dt:hojeISO(),autor:E.perfil.nome_sistema,tipo:tipo,texto:texto,origem:"SITE"});
  if(error)throw new Error(traduzErro(error.message));return hid;}
function okS(r){if(r.error)throw new Error(traduzErro(r.error.message));return r.data;}
// Busca paginada: o banco entrega no máximo 1000 linhas por pedido; esta função
// pede de 1000 em 1000 até esgotar (teto de segurança: 20 páginas = 20 mil linhas).
// A consulta passada precisa ter ordenação estável (terminar em .order("linha")).
async function paginadoS(monta){const out=[];let ult=null;
  for(let i=0;i<20;i++){const r=okS(await monta().range(i*1000,i*1000+999))||[];
    if(!r.length)break;
    const chave=JSON.stringify(r[0]);
    if(chave===ult)break; // servidor ignorou o range: não duplicar
    ult=chave;out.push(...r);if(r.length<1000)break;}
  return out;}

    const v=await paginadoS(()=>supa.from("operacional").select("*").order("data_revisao_dt",{ascending:true,nullsFirst:false}).order("linha"));

  async coroaAtual(){const r=okS(await supa.from("coroa").select("*"))||[];
    // dourado FORTE acende NA HORA da coroação (sexta) e vale até o fim da
    // semana do reinado; um reinado novo substitui o anterior na hora.
    // (semana = segunda do reinado; a coroação acontece na sexta anterior)
    const hj=new Date();hj.setHours(0,0,0,0);
    const vig=r.filter(x=>{const seg=new Date(String(x.semana).slice(0,10)+"T00:00:00");
      const ini=new Date(seg);ini.setDate(ini.getDate()-3);   // sexta da coroação
      const fim=new Date(seg);fim.setDate(fim.getDate()+6);   // domingo do reinado
      return hj>=ini&&hj<=fim;})
      .sort((a,b)=>String(b.semana).localeCompare(String(a.semana)));
    return vig[0]||null;},

async function entrou(){
  let p; try{p=await DB.perfil();}catch(e){avisoLogin("erro","Erro ao carregar perfil: "+e.message);return;}
  if(!p){avisoLogin("info","Você entrou, mas este e-mail não está vinculado a nenhum membro ATIVO da equipe. Fale com a administração.");if(MODO_SUPABASE)await supa.auth.signOut();return;}
  E.perfil=p;
  try{E.equipe=await DB.equipe();}catch(e){E.equipe=[];}
  // lista de operacionais vem da EQUIPE (status ATIVO, fora heads/vendedor):
  // inativar alguém nas Configurações o remove de todas as telas na hora
  const opsAtivos=(E.equipe||[]).filter(m=>String(m.status||"").toUpperCase()==="ATIVO"
    &&!/head/i.test(m.cargo||"")&&!/vendedor|comercial|outro time/i.test(m.cargo||""))
    .map(m=>m.nome_sistema);
  if(opsAtivos.length){OPERACIONAIS.length=0;opsAtivos.forEach(n=>OPERACIONAIS.push(n));}
  ge("tela-login").style.display="none"; ge("app").style.display="block";
  ge("sb-av").textContent=(p.nome_sistema||"?").charAt(0);
  ge("sb-nm").textContent=p.nome_sistema; ge("sb-rl").textContent=p.cargo+(p.admin_sim?" · ADMIN":"");
  await carregarConfig(); montarVerComo(); faixaVerComo(); montarMenu();
  // vigia de inatividade: só assessores de verdade — nunca heads/admin nem no "Ver como"
  if(OPERACIONAIS.includes(p.nome_sistema)&&!p.head_sim&&!p.admin_sim&&!p.vendo_como_outro)
    iniciarVigiaInatividade();
  // sinal de presença: "estou com o site aberto" a cada 5 min (todos os perfis)
  if(!p.vendo_como_outro){DB.presencaPing();setInterval(()=>DB.presencaPing(),5*60000);}
  vigiarVersao();
  coroaViva();
}
// página aberta há dias = código velho + regras novas do banco = erro que
// parece defeito. A cada 10 min confere o carimbo publicado; mudou → faixa.
async function vigiarVersao(){
  if(!MODO_SUPABASE)return;
  const pega=async()=>{try{const r=await fetch("versao.json?ts="+Date.now(),{cache:"no-store"});
    if(!r||!r.ok)return null;const j=await r.json();return (j&&j.v)||null;}catch(e){return null;}};
  E._versao=await pega();if(!E._versao)return;
  setInterval(async()=>{const v=await pega();
    if(v&&v!==E._versao&&!document.getElementById("aviso-versao")){
      const b=ce("div");b.id="aviso-versao";
      b.style.cssText="position:fixed;top:0;left:0;right:0;z-index:700;background:var(--navy);color:white;padding:10px 16px;text-align:center;font-size:14px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.3)";
      b.innerHTML="&#128260; <b>Saiu uma versão nova do sistema</b> — clique aqui para atualizar (leva 2 segundos)";
      b.onclick=()=>location.reload();
      document.body.appendChild(b);}},10*60000);
}
// Configurações vindas do banco (capacidade, tempos por operação, quem
// corrige/delega). Head edita na tela "Configurações" — sem republicar o
// site. Se o banco não responder, seguem os padrões embutidos no código.
async function carregarConfig(){
  try{const cf=await DB.config();
    (cf.cap||[]).forEach(r=>{CAP[r.nome]=r.minutos;});
    (cf.tmp||[]).forEach(r=>{TEMPOS_PADRAO[r.operacao==="_PADRAO"?"_default":r.operacao]=r.minutos;});
    if((cf.per||[]).length){CORR_HEADS.length=0;AUTORIZADOS_DELEGAR.length=0;
      cf.per.forEach(r=>{if(r.pode_corrigir)CORR_HEADS.push(r.nome);if(r.pode_delegar)AUTORIZADOS_DELEGAR.push(r.nome);
        DELEGA_PARA[r.nome]=String(r.delega_para||"").split(",").map(s=>s.trim()).filter(Boolean);
        PROSPEC[r.nome]=parseInt(r.prospeccao_min)||0;
        PROSPEC_SEMPRE[r.nome]=!!r.prospeccao_sempre;
        FOLLOWUP[r.nome]=parseInt(r.followup_min)||0;});}
  }catch(e){/* segue com os padrões do código */}
}

// ============================================== classificação de tarefas
function classificar(t){
  const d=diasAte(t.data_revisao_dt), st=String(t.status_tarefa||"");
  // concluída = marcada EM DIA (robô das 7h) OU recém-concluída pelo site:
  // o botão Concluir grava status AGUARDANDO com a revisão no futuro — sem
  // isto, a tarefa DIÁRIO concluída ficava pendurada no dia até a manhã seguinte
  t._dias=d; t._concluida=st.includes("EM DIA")||(st.includes("AGUARDANDO")&&d!==null&&d>0);
  t._delegada=st.includes("DELEGADA");
  t._emCorrecao=!!String(t.correcao_head||"").trim();
  t._impulso=String(t.supervisao||"").includes("IMPULSO de");
  const pf=diasAte(t.prazo_fatal_dt); t._pfDias=pf; t._prazoAlerta=(pf!==null&&pf<=5);
  t._impedimento=/impedimento/i.test(String(t.operacao||""));
  t._quedaDias=t._impedimento?diasAte(t.queda_impedimento_dt):null;
  // fixas de janela: a meta diária vem gravada na orientação ([meta:70min])
  t._meta=parseInt((String(t.supervisao||"").match(/\[meta:(\d+)min\]/)||[])[1])||null;
  t._tempo=t._meta||tempoDe(t.operacao);
  let chk=String(t.check_||"");
  // AGUARDANDO converte pela proximidade do prazo (regra do Code.gs)
  if(chk==="AGUARDANDO"){
    if(pf!==null&&pf<=5){chk="IMEDIATO";}
    else if(d!==null&&d<=0){chk="DIÁRIO";}
    else chk="AGUARDANDO_FUTURO";
  }
  t._chk=chk;
  t._atrasada=!t._concluida&&d!==null&&d<0;
  if(t._delegada)t._g=0;
  else if(chk==="IMEDIATO"&&!t._concluida&&(d===null||d<=0))t._g=1;
  else if(t._atrasada&&chk!=="IMEDIATO")t._g=2;
  else if(!t._concluida&&(d===0||/DI[ÁA]RIO/.test(chk)))t._g=3;
  else t._g=4;
  return t;
}

// ======================================================= TELA: MINHAS
async function telaMinhas(){
  setNav("minhas","Minhas Tarefas"); carregando();
  let dados,reun;try{[dados,reun]=await Promise.all([DB.tarefas(),DB.reunioes()]);await carregarFinanceiro();}
  catch(e){return erro(e.message);}
  let ts=(dados||[]).map(classificar); aplicarFinanceiro(ts);
  E._todasBanco=ts;
  const minhas=ts.filter(t=>ehMeuNome(t.assessor));
  E.tarefas=ts;  // todas visíveis (head enxerga tudo; abrirTarefa acha qualquer uma)
  const nome=E.perfil.nome_sistema;
  const emCorr=minhas.filter(t=>t._emCorrecao&&!t._delegada);
  const deleg=minhas.filter(t=>t._delegada);
  const ativas=minhas.filter(t=>!t._emCorrecao&&!t._delegada&&t.id_tarefa);
  // reuniões de hoje
  const hjBR=brHoje(), hjISO=hojeISO();
  const meetings=(reun||[]).filter(r=>r.assessor===nome&&(r.data===hjBR||String(r.data_dt||"").slice(0,10)===hjISO));
  const minReu=meetings.reduce((s,m)=>s+(parseInt(m.duracao_min_num||m.duracao_min)||30),0);
  // capacidade (algoritmo do Code.gs + tempos reais do robô de produtividade)
  await carregarTemposReais(ts);
  ativas.forEach(t=>{t._tempo=t._meta||tempoPlanoDe(nome,t.operacao);});
  // ✅ desconta o que a pessoa JÁ trabalhou hoje (TIMERs de hoje): concluir
  // tarefa não "devolve" os minutos ao dia — sem isso a fila repunha tarefa
  // nova infinitamente conforme as atrasadas eram concluídas.
  let jaTrab=0;
  try{const hh=await DB.historicoHoje();
    jaTrab=(hh||[]).filter(r=>r.tipo==="TIMER"&&ehMeuNome(r.autor))
      .reduce((s,r)=>s+(parseInt((String(r.texto||"").match(/(\d+)\s*min/)||[])[1])||0),0);
  }catch(e){}
  const cap=capDe(nome), capDia=Math.max(60,cap-minReu), capDisp=Math.max(0,capDia-jaTrab);
  const imed=ativas.filter(t=>t._g===1), atr=ativas.filter(t=>t._g===2).sort((a,b)=>a._dias-b._dias),
        diar=ativas.filter(t=>t._g===3&&/DI[ÁA]RIO/.test(t._chk)),
        hoje0=ativas.filter(t=>t._g===3&&!/DI[ÁA]RIO/.test(t._chk));
  const dow=new Date().getDay();
  const semanal=ativas.filter(t=>t._chk==="SEMANAL"&&t._dias>0&&t._dias<=6&&(dow===1||dow===2));
  const mensal=ativas.filter(t=>t._chk==="MENSAL"&&t._dias>0&&t._dias<=7);
  // peso financeiro nas semanais/mensais: quem pagou vem primeiro
  const pesoF=t=>t._pago?0:(t._prov?1:2);
  semanal.sort((a,b)=>pesoF(a)-pesoF(b)||b._dias-a._dias);
  mensal.sort((a,b)=>pesoF(a)-pesoF(b)||b._dias-a._dias);
  const plano=[],fila=[],jaAdd={};
  const push1=(t,urg)=>{const k=t.id_tarefa;if(k&&jaAdd[k])return false;if(k)jaAdd[k]=true;t._urg=urg;plano.push(t);return true;};
  // IMEDIATO entra sempre; o resto só até a capacidade — excedente vai à fila
  imed.forEach(t=>push1(t,1));
  let rem=Math.max(0,capDisp-imed.reduce((s,t)=>s+t._tempo,0));
  // 🎯 bloco FIXO de prospecção (ex.: Madu 4h): reservado TODOS os dias,
  // antes das demais tarefas — só as imediatas passam na frente. O que não
  // couber no restante do dia vai para a fila normalmente.
  const janelaPros=PROSPEC[nome]||0;
  let reservaPros=0;
  if(janelaPros>0&&PROSPEC_SEMPRE[nome]){reservaPros=Math.min(rem,janelaPros);rem-=reservaPros;}
  // 📞 Follow-up de propostas: bloco DIÁRIO fixo para retomar as propostas na
  // rua sob responsabilidade da pessoa (pedido da Bruna, 18/08/2026). O tempo
  // cresce sozinho com a carteira (+3 min por proposta acima de 10, teto 90).
  let propsFu=[];
  try{propsFu=minhasNaRua(await DB.propostas(),nome);}catch(e){}
  const fuJanela=fuEfetivo(FOLLOWUP[nome]||0,propsFu.length);
  let reservaFu=0;
  // obrigatório TODOS os dias: reserva integral mesmo com o dia lotado
  // (antes, dia cheio engolia o bloco e o cartão sumia — pedido da Bruna 19/08)
  if(fuJanela>0){reservaFu=fuJanela;rem=Math.max(0,rem-reservaFu);}
  for(const t of diar){if(jaAdd[t.id_tarefa])continue;
    if(rem-t._tempo<0){fila.push(t);continue;}if(push1(t,t._dias<0?2:3))rem-=t._tempo;}
  let nAtr=0;
  for(const t of atr){if(jaAdd[t.id_tarefa])continue;
    if(rem<=0&&nAtr>=3){fila.push(t);continue;}if(push1(t,2)){rem-=t._tempo;nAtr++;}}
  rem=Math.max(0,rem);
  for(const t of hoje0){if(jaAdd[t.id_tarefa])continue;
    if(rem<=0){fila.push(t);continue;}if(push1(t,3))rem-=t._tempo;}
  // 🎯 Janela de Prospecção por mérito: sem nada VENCIDO (atrasadas ou
  // imediatas de dias anteriores) o bloco fica programado no dia — imediatas
  // DO PRÓPRIO DIA convivem com a janela (pedido da Bruna, 12/08/2026). As
  // ANTECIPAÇÕES (semanais/mensais futuras) só entram no que sobrar.
  const imedVencidas=imed.filter(t=>typeof t._dias==="number"&&t._dias<0);
  if(janelaPros>0&&!reservaPros&&imedVencidas.length===0&&atr.length===0){
    reservaPros=Math.min(rem,janelaPros);rem-=reservaPros;}
  for(const t of semanal.concat(mensal)){if(jaAdd[t.id_tarefa])continue;
    if(rem<=0){fila.push(t);continue;}if(push1(t,4))rem-=t._tempo;}
  plano.sort((a,b)=>a._urg-b._urg||a._dias-b._dias);
  const planejado=plano.reduce((s,t)=>s+t._tempo,0);
  const filaMin=fila.reduce((s,t)=>s+t._tempo,0);
  // prospecção e follow-up OCUPAM a barra do dia (quem delega vê o mesmo)
  const pct=Math.min(100,Math.round((planejado+reservaPros+reservaFu)/Math.max(1,capDisp)*100));
  E._plano=plano;E._minhasTodas=minhas;
  // ------- monta html
  let h=bannerPrazoFatal(ativas);
  const pctCor=pct>90?"var(--red)":pct>70?"var(--amber)":"var(--green)";
  h+=`<div class="painel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <b style="color:var(--navy)">&#128202; Capacidade do dia</b>
    <span style="display:flex;gap:4px">
      <button class="btn ${E._vis!=="kanban"?"btp":"bts"} btsm" onclick="E._vis='lista';desenhaMinhas()">&#9776; Lista</button>
      <button class="btn ${E._vis==="kanban"?"btp":"bts"} btsm" onclick="E._vis='kanban';desenhaMinhas()">&#9707; Kanban</button></span></div>
    <div style="display:flex;align-items:center;gap:8px"><div class="cap" style="flex:1"><div style="width:${pct}%;background:${pctCor}"></div></div>
    <b style="color:${pctCor}">${pct}%</b></div>
    <div style="font-size:11px;color:var(--gray);margin-top:4px">&#9201; ${fmtMin(planejado)} de ${fmtMin(capDisp)} disponíveis
      ${jaTrab?`· &#9989; ${fmtMin(jaTrab)} já trabalhados hoje`:""}
      ${reservaPros?`· &#127919; ${fmtMin(reservaPros)} de prospecção`:""}
      ${reservaFu?`· &#128222; ${fmtMin(reservaFu)} de follow-up`:""}
      ${minReu?`· &#128197; ${fmtMin(minReu)} em reuniões`:""} · &#128203; ${ativas.length} no portfólio (mostrando ${plano.length})</div></div>`;
  if(capDisp===0&&jaTrab>0)h+=`<div class="painel" style="background:#EAF7EA;border-color:var(--green)">
    <div class="bloco-t" style="color:var(--green)">&#127881; Seu dia fechou</div>
    <div style="font-size:12px;color:var(--gray)">Você já cumpriu a capacidade de hoje${fila.length?` — o que sobrou (${fila.length} tarefa(s)) fica na fila para amanhã`:""}. Só as imediatas continuam entrando.</div></div>`;
  if(reservaPros>0)h+=`<div class="painel" style="background:#EAF7EA;border-color:var(--green)">
    <div class="bloco-t" style="color:var(--green)">&#127919; ${PROSPEC_SEMPRE[nome]?"Bloco fixo do dia":"Dia dominado"} — ${fmtMin(reservaPros)} reservadas para prospecção</div>
    <div style="font-size:12px;color:var(--gray);margin-bottom:6px">${PROSPEC_SEMPRE[nome]
      ?"Este bloco é reservado todos os dias por definição da banca — quem delega também o vê como tempo ocupado. As demais tarefas se organizam no restante do dia."
      :"Nada vencido na sua fila: este bloco já está programado no seu dia para buscar negócios novos — quem delega também o vê como tempo ocupado. "+(imed.length?"Dê conta das imediatas de hoje e use o bloco no melhor horário. ":"")+"O planejador não antecipa tarefas dentro dele, e o tempo conta no Diário e na sua produtividade."}</div>
    <button class="btn btg btsm" onclick="iniciarProspeccao()">&#127919; Prospectar agora (liga o relógio)</button></div>`;
  // 📞 o follow-up entra como CARTÃO do dia na lista (depois de imediatas e
  // atrasadas) — pedido da Bruna, 18/08/2026; a fila abre num painel próprio
  E._fuCard=null;
  if(reservaFu>0){
    const pBR=s=>{const m=String(s||"").match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?new Date(+m[3],+m[2]-1,+m[1]):null;};
    const hj0=new Date();hj0.setHours(0,0,0,0);
    const ordFu=[...propsFu].sort((a,b)=>{
      const ra=pBR(a.data_retorno),rb=pBR(b.data_retorno);
      const va=ra&&ra<=hj0?0:1,vb=rb&&rb<=hj0?0:1;
      if(va!==vb)return va-vb;
      return String(a.data_proposta_dt||"9999").localeCompare(String(b.data_proposta_dt||"9999"));});
    E._propMap=E._propMap||{};ordFu.forEach(p=>{E._propMap[p.id_proposta]=p;});
    E._fuCard={min:reservaFu,naRua:propsFu.length,
      fila:ordFu.map(p=>({id:p.id_proposta,cliente:p.cliente,valor:p.valor,status:p.status,
        ret:p.data_retorno,venc:!!(pBR(p.data_retorno)&&pBR(p.data_retorno)<=hj0)}))};
  }
  // quem pode delegar (e não é head) vê a fila do seu grupo — pedido do Ygor:
  // "preciso saber quem recebe" (head já tem isso no Painel)
  if(AUTORIZADOS_DELEGAR.includes(nome)&&!E.perfil.head_sim){
    let cgEq=[];try{cgEq=await DB.cargaEquipe();}catch(e){}
    const alvosEq=new Set(alvosDelegacao(nome));
    const lsEq=(cgEq||[]).filter(r=>alvosEq.has(loginDe(r.nome)))
      .map(r=>({n:loginDe(r.nome),dia:r.pendentes||0,tot:r.total_ativas||0,pros:r.pros_min||0,fu:r.fu_min||0,
        folga:Math.max(0,capDe(loginDe(r.nome))-(r.minutos||0)-(r.pros_min||0)-(r.fu_min||0)-(r.trab_min||0))}))
      .sort((a,b)=>b.folga-a.folga);
    if(lsEq.length)h+=`<div class="painel"><div class="bloco-t">&#128101; Fila do seu grupo (para decidir delegações)</div>`+
      lsEq.map(l=>`<div class="linha-item"><span><b>${esc(l.n)}</b></span>
        <span style="font-size:12px">${l.dia} do dia · ${l.tot} no total${l.pros?` · &#127919; ${fmtMin(l.pros)} prospectando`:""}${l.fu?` · &#128222; ${fmtMin(l.fu)} follow-up`:""} · <b style="color:var(--green)">${fmtMin(l.folga)} livres</b></span></div>`).join("")+
      `<div style="font-size:11px;color:var(--gray);margin-top:4px">Mesma régua do robô de sugestões: "do dia" = vencidas + de hoje; folga = capacidade menos a fila do dia, menos prospecção (&#127919;), follow-up de propostas (&#128222;) e o que a pessoa já trabalhou hoje.</div></div>`;
  }
  if(meetings.length)h+=`<div class="painel"><div class="bloco-t">&#128197; Compromissos hoje</div>`+
    meetings.map(m=>`<div class="linha-item"><span><b>${esc(m.horario||"—")}</b> ${esc(m.titulo)}${m.cliente?" · "+esc(m.cliente):""}</span>
      <span>${esc(m.duracao_min||m.duracao_min_num||30)}min <button class="btn bts btsm" onclick="removerReuniao('${esc(m.id_reuniao)}')">&#10005;</button></span></div>`).join("")+`</div>`;
  if(emCorr.length)h+=`<div class="painel" style="background:#F5F2FC;border-color:#D9CEF0">
    <div class="bloco-t" style="color:#6B4FBF">&#9999; ${emCorr.length} aguardando correção</div>`+
    emCorr.map(t=>`<div class="linha-item" style="cursor:pointer" onclick="abrirTarefa('${esc(t.id_tarefa)}')">
      <span>${esc(t.cliente)} · ${esc(t.operacao||"")}</span>
      <span style="color:#6B4FBF">→ ${esc(t.correcao_head)}${t.correcao_retorno_dt?" · retorno "+brData(t.correcao_retorno_dt):""}</span></div>`).join("")+`</div>`;
  if(deleg.length)h+=`<div class="painel" style="background:#EEF3F9;border-color:#C9D8EA">
    <div class="bloco-t" style="color:#1F4E79">&#129309; Delegadas — aguardando retorno (${deleg.length}) <span style="font-weight:400">— não contam na capacidade</span></div>`+
    deleg.map(t=>`<div class="linha-item" style="cursor:pointer" onclick="abrirTarefa('${esc(t.id_tarefa)}')">
      <span>${esc(t.cliente)} · ${esc(t.operacao||"")}</span><b>${esc(t.status_tarefa)}</b></div>`).join("")+`</div>`;
  if(fila.length)h+=`<div class="painel" style="background:var(--gray-lt)">
    <div class="bloco-t">&#9203; Na fila — ${fila.length} tarefa(s) (&asymp; ${(filaMin/Math.max(1,capDia)).toFixed(1)} dia(s) de trabalho)</div>
    <div style="font-size:11px;color:var(--gray)">Não cabem na capacidade de hoje. Entram nos próximos dias na ordem de prioridade — ou a head pode liberar/delegar.</div></div>`;
  // sugestão do robô: delegar quando o dia não fecha (só para quem pode delegar)
  if(AUTORIZADOS_DELEGAR.includes(nome)&&planejado>capDisp){
    let excesso=planejado-capDisp,nSug=0;
    const cand=[...plano].filter(t=>t._urg>=2).sort((a,b)=>b._urg-a._urg||a._dias-b._dias);
    for(const t of cand){if(excesso<=0)break;excesso-=t._tempo;nSug++;}
    // carga dos colegas vem do medidor agregado do banco (não-head não
    // enxerga as tarefas alheias) e SÓ de quem a pessoa pode delegar
    let cargasEq=[];try{cargasEq=await DB.cargaEquipe();}catch(e){}
    const folgas=alvosDelegacao(nome).map(x=>{
      const c=(cargasEq||[]).find(r=>loginDe(r.nome)===x);
      if(!c)return null;   // sem medição visível = fora da lista (não chuta "livre")
      return{n:x,folga:capDe(x)-c.minutos-(c.pros_min||0)-(c.fu_min||0)-(c.trab_min||0)};}).filter(o=>o&&o.folga>=30).sort((a,b)=>b.folga-a.folga);
    if(nSug>0)h+=`<div class="painel" style="background:#FFF7E6;border-color:var(--amber)">
      <div class="bloco-t" style="color:#7F5200">&#9878; Sugestão do robô: delegar ${nSug} tarefa(s) hoje</div>
      <div style="font-size:12px">Seu dia soma <b>${fmtMin(planejado)}</b> para <b>${fmtMin(capDisp)}</b> de capacidade — delegando ${nSug}, a agenda fecha.
      ${folgas.length?`<br>Com folga hoje: ${folgas.slice(0,4).map(o=>`<b>${esc(o.n)}</b> (&asymp;${fmtMin(o.folga)} livres)`).join(" · ")}`:""}
      <br><span style="color:var(--gray);font-size:11px">Abra a tarefa e use o botão &#129309; Delegar — a decisão é sempre sua.</span></div></div>`;}
  h+=`<div class="sg">
    <div class="sc"><div class="sl">Hoje</div><div class="sv">${plano.length}</div></div>
    <div class="sc"><div class="sl">Imediatas</div><div class="sv ${imed.length?"red":"green"}">${imed.length}</div></div>
    <div class="sc"><div class="sl">Em atraso</div><div class="sv ${atr.length?"red":"green"}">${atr.length}</div></div>
    <div class="sc"><div class="sl">Capacidade</div><div class="sv" style="color:${pctCor}">${pct}%</div></div></div>`;
  h+=`<div class="flr"><input class="si" id="mt-q" placeholder="&#128269; Filtrar por cliente..." oninput="desenhaMinhas()">
    <select class="fsel" id="mt-u" onchange="desenhaMinhas()"><option value="">Todas</option>
      <option value="1">&#128308; Imediatas</option><option value="2">&#128992; Atrasadas</option>
      <option value="3">&#128309; Hoje</option></select></div>
    <div id="mt-lista"></div>
    <div id="mt-corrigir"></div>`;
  ge("conteudo").innerHTML=h;
  desenhaMinhas();
  if(E.perfil.head_sim||CORR_HEADS.includes(nome))painelParaCorrigir("mt-corrigir");
}
function desenhaMinhas(){
  const alvo=ge("mt-lista");if(!alvo)return;
  const q=(ge("mt-q")?.value||"").toLowerCase(), u=ge("mt-u")?.value||"";
  let lista=E._plano||[];
  if(q)lista=(E._minhasTodas||[]).filter(t=>!t._delegada&&!t._emCorrecao&&
    (String(t.cliente||"").toLowerCase().includes(q)||String(t.operacao||"").toLowerCase().includes(q)));
  if(u)lista=lista.filter(t=>String(t._urg||t._g)===u);
  if(E._vis==="kanban"){alvo.innerHTML=renderKanban(lista);return;}
  const rot={1:"&#128308; Imediatas",2:"&#128992; Em atraso",3:"&#128309; Para hoje",4:"&#128995; Completando capacidade"};
  const g={1:[],2:[],3:[],4:[]};lista.forEach(t=>g[t._urg||4]?.push(t));
  let h="";let algum=false;
  [1,2,3,4].forEach(k=>{
    // 📞 o cartão do follow-up abre o dia, junto das IMEDIATAS (é diário
    // e obrigatório — pedido da Bruna, 19/08/2026)
    if(k===1&&E._fuCard&&(!u||u==="1")){h+=fuCardHtml();algum=true;}
    if(!g[k].length)return;algum=true;
    h+=`<div class="grupo-t"><span>${rot[k]}</span><span class="qt">${g[k].length} · ~${g[k].reduce((s,t)=>s+t._tempo,0)}min</span></div>`
      +g[k].map(t=>cardTarefa(t,false,true)).join("");});
  alvo.innerHTML=algum?h:`<div class="vazio"><div style="font-size:30px">&#127881;</div>
    <p style="font-weight:600;margin-top:8px">Nenhuma tarefa pendente!</p></div>`;
}
// cartão diário do follow-up de propostas — clica e abre a fila + relógio

  const f=E._fuCard;if(!f)return "";

  return `<div class="grupo-t"><span>&#128222; Comercial do dia</span><span class="qt">1 · ~${f.min}min</span></div>

      <div style="flex:1;min-width:0"><div class="tcc">&#128222; Follow-up de propostas${rolando?' <span class="tag tek">&#9201; rolando agora</span>':''}${vencidas?` <span class="tag ti">${vencidas} retorno(s) vencido(s)</span>`:""}</div>
      <div class="tco">${f.naRua} proposta(s) na rua · bloco de ${fmtMin(f.min)} — toque para abrir a fila e ligar o relógio</div></div>
      <div style="font-family:'DM Mono';font-size:11px;color:#1F4E79">&#9201; ~${f.min}min</div></div>`;
}
function abrirFollowupDia(){
  const f=E._fuCard;if(!f)return;
  modal2("&#128222; Follow-up de propostas — hoje",
    `${fmtMin(f.min)} reservados · ${f.naRua} proposta(s) na rua sob sua responsabilidade`,
    `<div style="font-size:12px;color:var(--gray);margin-bottom:6px">Mais paradas primeiro. Clique na proposta para registrar a rodada (próximo passo + data de retorno obrigatórios). Ligue o relógio: o tempo conta na sua produtividade e aparece para as heads em "Em Andamento Agora".</div>`
    +f.fila.map(x=>`<div class="linha-item" style="cursor:pointer" onclick='abrirNegociacao(${JSON.stringify(x.id)})'>
      <span><b>${esc(x.cliente||"")}</b> · R$ ${esc(x.valor||"0")} · ${esc(x.status||"")}</span>
      <span style="font-size:11px;color:${x.venc?"var(--red)":"var(--gray)"}">${x.ret?"retorno "+esc(x.ret):"sem retorno combinado"}</span></div>`).join("")
    +`<button class="btn btp btw" style="margin-top:10px" onclick="fecharModal2();iniciarFollowup()">&#128222; Começar follow-up (liga o relógio)</button>`);
}
function renderKanban(lista){
  const cols=[[1,"&#128308; Imediatas","#FCE4D6"],[2,"&#128992; Urgentes","#FFF2CC"],
              [3,"&#128309; Hoje","#DBEAFE"],[4,"&#128995; Agendadas","#EDE9FE"]];
  return `<div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:8px">`+cols.map(([k,rot,bg])=>{
    const ct=lista.filter(t=>(t._urg||t._g)===k);
    return `<div style="flex:0 0 260px;background:var(--gray-lt);border-radius:12px;padding:9px">
      <div style="font-size:11px;font-weight:700;background:${bg};border-radius:6px;padding:5px 8px;margin-bottom:8px">${rot} (${ct.length})</div>
      ${k===1&&E._fuCard?`<div class="tc u3" style="margin-bottom:6px;border-left:4px solid #1F4E79;background:#EEF3F9" onclick="abrirFollowupDia()">
        <div style="flex:1;min-width:0"><div class="tcc">&#128222; Follow-up de propostas</div>
        <div class="tco">${E._fuCard.naRua} na rua · ${fmtMin(E._fuCard.min)}</div></div></div>`:""}
      ${ct.map(t=>`<div class="tc u${k}" style="margin-bottom:6px" onclick="abrirTarefa('${esc(t.id_tarefa)}')">
        <div style="flex:1;min-width:0"><div class="tcc">${esc(t.cliente)}</div>
        <div class="tco">${esc(t.operacao||"")}</div>
        <div class="tco" style="font-family:'DM Mono';margin-top:4px">&#9201; ~${t._tempo}min</div></div></div>`).join("")}</div>`;
  }).join("")+`</div>`;
}
// Painel "Para corrigir" (heads veem todas; quem delega vê as direcionadas a si)
async function painelParaCorrigir(alvoId){
  const box=ge(alvoId);if(!box)return;
  const todas=(E._todasBanco||[]).filter(t=>t._emCorrecao);
  const meu=E.perfil.nome_sistema.toLowerCase();
  const minhas=todas.filter(t=>String(t.correcao_head||"").toLowerCase()===meu);
  const lista=E.perfil.head_sim?todas:minhas;
  if(!lista.length){box.innerHTML="";return;}
  const dias=v=>v?diasAte(String(v).slice(0,10)):99;
  // head: agrupado por corretora — o SEU grupo primeiro (mesmo vazio, os
  // demais aparecem), depois do mais carregado para o menos

    const g={};lista.forEach(t=>{const k=String(t.correcao_head||"(sem head)").trim()||"(sem head)";(g[k]=g[k]||[]).push(t);});
    const nomes=Object.keys(g).sort((a,b)=>g[b].length-g[a].length);
    const idx=nomes.findIndex(n=>n.toLowerCase()===meu);
    if(idx>0){nomes.splice(idx,1);nomes.unshift(E.perfil.nome_sistema);}
    grupos=nomes.map(n=>({nome:n,itens:g[n]}));
  }else grupos=[{nome:null,itens:lista}];
  const itemHtml=t=>{const d=dias(t.correcao_retorno_dt);
      const cor=d<0?"var(--red)":d<=1?"var(--amber)":"var(--gray)";
      const txt=d<0?"venceu":d===0?"vence hoje":d===1?"vence amanhã":"retorno "+brData(t.correcao_retorno_dt);
      return `<div style="border-bottom:1px solid var(--gray-lt);padding:8px 0">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <div style="cursor:pointer;flex:1" onclick="abrirTarefa('${esc(t.id_tarefa)}')">
          <b style="color:var(--navy)">${esc(t.cliente)}</b> <span class="tco">${esc(t.operacao||"")} · &#128100; ${esc(t.assessor||"")}</span><br>
          <span style="font-size:11px;color:#6B4FBF">Correção → ${esc(t.correcao_head)}</span>
          <span style="font-size:11px;color:${cor};font-weight:600;margin-left:6px">${txt}</span></div>
        <span style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
          ${t.correcao_link?(urlPasta(t.correcao_link)?`<a href="${esc(urlPasta(t.correcao_link))}" target="_blank" style="font-size:11px;color:var(--dani)">&#128193; Pasta</a>`:`<span style="font-size:11px;color:var(--gray)" title="${esc(t.correcao_link)}">&#128206; ${/anex/i.test(t.correcao_link)?"anexado na tarefa":"sem link válido"}</span>`):""}
          <button class="btn btp btsm" onclick="devolverCorrecao('${esc(t.id_tarefa)}',${t.linha})">&#8617; Devolver ao assessor</button>
          ${(E.perfil.head_sim&&d<0)?`<button class="btn bts btsm" onclick="puxarCorrecao('${esc(t.id_tarefa)}',${t.linha})">&#9995; ${String(t.correcao_head||"").toLowerCase()===meu?"Renovar prazo (3d úteis)":"Puxar para mim"}</button>`:""}</span></div>
        ${t.correcao_justif?`<div style="font-size:11px;color:var(--gray);font-style:italic;margin-top:3px">Justificativa: ${esc(t.correcao_justif)}</div>`:""}</div>`;};
  box.innerHTML=`<div class="painel" style="border-color:#D9CEF0;margin-top:14px">
    <div class="bloco-t" style="color:#6B4FBF">&#9999; Para corrigir · ${lista.length}${E.perfil.head_sim?` (${minhas.length} com você)`:""}</div>`+
    grupos.map(gr=>{
      const cab=gr.nome===null?"":(()=>{
        const souEu=gr.nome.toLowerCase()===meu;
        const venc=gr.itens.filter(t=>dias(t.correcao_retorno_dt)<0).length;
        return `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:9px;padding:5px 9px;border-radius:8px;background:${souEu?"#EFE9FA":"var(--gray-lt)"}">

          <span style="font-size:11px;color:var(--gray)">${gr.itens.length} correção(ões)${venc?` · <b style="color:var(--red)">${venc} vencida(s)</b>`:""}</span></div>`;})();
      return cab+gr.itens.map(itemHtml).join("");}).join("")+`</div>`;
}
async function puxarCorrecao(id,linha){
  const t=(E._todasBanco||E.tarefas||[]).find(x=>x.id_tarefa===id)||{id_tarefa:id,linha:linha};
  if(!confirm(`Puxar esta correção para você, com novo prazo de 3 dias úteis?`))return;
  try{await DB.correcaoPuxar({id_tarefa:id,linha:linha,id_cliente:t.id_cliente,correcao_head:t.correcao_head});}
  catch(e){toast("Erro: "+e.message,"erro");return;}
  toast("Correção agora é sua — novo prazo registrado.","ok");recarregar();
}
async function devolverCorrecao(id,linha){
  try{await DB.correcaoDevolver({id_tarefa:id,linha:linha,id_cliente:(E.tarefas.find(x=>x.id_tarefa===id)||{}).id_cliente});}
  catch(e){toast("Erro: "+e.message,"erro");return;}
  toast("Devolvida ao assessor (imediato)!","ok");recarregar();
}
async function removerReuniao(id){
  try{await DB.reuniaoDel(id);}catch(e){toast("Erro: "+e.message,"erro");return;}
  toast("Removido","ok");recarregar();
}

// =================================================== CARD DA TAREFA
function podeAgirNa(t){return E.perfil.head_sim||ehMeuNome(t.assessor)
  ||AUTORIZADOS_DELEGAR.includes(E.perfil.nome_sistema);}
async function abrirTarefa(id){
  esconderDock();
  if(typeof marcarAtividade==="function")marcarAtividade();
  const t=E.tarefas.find(x=>x.id_tarefa===id);if(!t)return;
  // reabertura do MESMO cartão (ex.: depois de registrar andamento): o
  // cronômetro NÃO zera — continua contando do início da sessão
  const mesma=!!(E.atual&&E.atual.id_tarefa===id&&E.timerIni&&!E.atual._consulta);
  // troca para OUTRO cartão sem fechar: grava o tempo do anterior antes
  if(E.atual&&E.atual.id_tarefa!==id&&E.timerIni&&!E.atual._consulta){
    const ant=E.atual,c=minutosDaSessao(ant);
    clearInterval(E.timerInt);E.timerIni=null;
    DB.sessaoConcluir(c.min).catch(()=>{});
    if(c.min>=1)DB.tempo({id_tarefa:ant.id_tarefa,id_cliente:ant.id_cliente,minutos:c.min}).catch(()=>{});
    if(c.nota)DB.nota({id_tarefa:ant.id_tarefa,id_cliente:ant.id_cliente,tipo:"HISTORICO",texto:c.nota}).catch(()=>{});}
  E.atual=t;E._propGateOk=false;
  t._consulta=!podeAgirNa(t);
  ge("m-titulo").textContent=t.cliente||"";
  ge("m-sub").innerHTML=`<span style="cursor:pointer" title="Clique para corrigir o tipo" onclick="editarOperacao()">${esc(t.operacao||"")} &#9998;</span> · ${esc(t.advogada||"")} · ${esc(t.check_||"")} · ${esc(t.assessor||"")}`;
  ge("m-corpo").innerHTML=`<div class="carregando"><div class="spin"></div></div>`;
  ge("modal").classList.add("aberto");
  if(t._consulta){E.timerIni=null;}
  else if(!mesma){iniciarTimer();
    try{await DB.sessaoIniciar({id_tarefa:t.id_tarefa,cliente:t.cliente,operacao:t.operacao});}catch(e){}}
  let hist=[];try{hist=await DB.historico(id);}catch(e){toast("Erro no histórico: "+e.message,"erro");}
  // impulso: traz junto o histórico da TAREFA DE ORIGEM — quem recebe precisa
  // do contexto para saber que andamento dar (relato dos assessores)
  if(t._impulso){
    const orig=(String(t.supervisao||"").match(/Origem:\s*(OP-\d+)/)||[])[1];
    if(orig){try{const ho=await DB.historico(orig);
      (ho||[]).forEach(h=>{h._daOrigem=orig;});
      hist=(hist||[]).concat(ho||[]);
    }catch(e){}}}
  // dono de tarefa DELEGADA: vê também o que o receptor registra no impulso
  if(t._delegada){
    const sub=(E.tarefas||[]).find(x=>x._impulso&&String(x.supervisao||"").includes("Origem: "+t.id_tarefa+" "));
    if(sub){try{const hs=await DB.historico(sub.id_tarefa);
      (hs||[]).forEach(h=>{h._daOrigem=sub.id_tarefa;});
      hist=(hist||[]).concat(hs||[]);
    }catch(e){}}}
  // impulsos JÁ FINALIZADOS desta tarefa: recupera a trilha completa
  // (o retorno gravado traz o id — buscamos o histórico daquele impulso)
  const jaTem=new Set((hist||[]).map(h=>h._daOrigem).filter(Boolean));
  const finalizados=[...new Set((hist||[]).map(h=>(String(h.texto||"").match(/Retorno do impulso \((OP-\d+)\)/)||[])[1]).filter(Boolean))]
    .filter(idf=>!jaTem.has(idf)).slice(0,5);
  for(const idf of finalizados){
    try{const hf=await DB.historico(idf);
      (hf||[]).forEach(h=>{h._daOrigem=idf;});
      hist=(hist||[]).concat(hf||[]);
    }catch(e){}}
  E._hist=hist;desenharCard(t,hist||[]);
  aplicarModoConsulta(t);
}
// modo consulta: leitura completa, ações escondidas (o banco já bloqueia a
// escrita — isto é o cinto por cima do banco)
function aplicarModoConsulta(t){
  if(!t._consulta)return;
  const corpo=ge("m-corpo");if(!corpo||!corpo.querySelectorAll)return;
  corpo.querySelectorAll("button,input,select,textarea").forEach(el=>{el.style.display="none";});
  corpo.insertAdjacentHTML("afterbegin",
    `<div class="aviso info" style="margin-bottom:10px">&#128065; <b>Modo consulta</b> — esta tarefa é de <b>${esc(t.assessor||"—")}</b>. Você vê tudo para se atualizar do cliente; quem age nela é o dono, as heads e quem pode delegar. Viu uma oportunidade? Avise a head ou quem delega.</div>`);
}

      <button class="btn btp btsm" onclick="salvarQueda()">&#128190;</button></span></div>`:""}

    ${t.prazo_fatal_dt?`<div>Prazo fatal:<br><b style="color:${t._prazoAlerta?"var(--red)":"var(--navy)"}">${brData(t.prazo_fatal_dt)}</b>
      ${(isHead||ehMeuNome(t.assessor))?` <button class="btn bts btsm" style="padding:1px 8px;font-size:10px" title="O prazo foi cumprido — limpar o alerta" onclick="marcarPrazoCumprido()">&#10003; cumprido</button>`:""}</div>`:""}
    <div>Responsável:<br><b>${esc(t.assessor||"—")}</b></div></div>

    <div class="linha-acao"><button class="btn btp btsm" onclick="finalizarImpulso('${esc(t.id_tarefa)}')">&#128229; Finalizar impulso e devolver</button>

  const podeDelegar=isHead||AUTORIZADOS_DELEGAR.includes(meuNome);
  h+=`<div class="bloco"><div class="bloco-t">Adicionar andamento</div>
    <textarea class="fta" id="nota-texto" placeholder="Descreva o andamento…"></textarea>
    <div class="linha-acao"><button class="btn btp btsm" onclick="salvarNota('ASSESSOR')">Salvar andamento</button>
    ${isHead?`<button class="btn bts btsm" onclick="salvarNota('SUPERVISÃO')">&#128204; Orientação (head)</button>`:""}
    ${podeDelegar?`<button class="btn bts btsm" onclick="abrirDelegar()">&#129309; Delegar</button>`:""}

  else{h+=`<div class="bloco"><div class="bloco-t">&#9203; Colocar em aguardando</div>
    <div style="background:#EFF6FF;border-radius:9px;padding:10px 12px">

  // no impulso, o Encerrar fica no painel verde lá de cima (fecha o CASO

  if(!t._impulso)h+=`<div class="bloco"><button class="btn btx btw" onclick="abrirEncerrar()">&#128193; Encerrar caso definitivamente</button>

    const ehHoje=String(en.data_dt||"").slice(0,10)===hojeISO();

function marcarAtividade(){E._ultAtiv=Date.now();
  const b=document.getElementById("aviso-inativo");if(b)b.remove();
  if(E._tituloInt){clearInterval(E._tituloInt);E._tituloInt=null;}
  if(E._tituloOrig)document.title=E._tituloOrig;}

  if(E._vigia)return;E._vigia=true;marcarAtividade();

function checarInatividade(){
  const d=new Date(),h=d.getHours(),dow=d.getDay();
  if(dow===0||dow===6||h<9||h>=19||(h>=12&&h<14))return;
  const chip=document.getElementById("chip-timer");
  if(E.timerIni||(chip&&chip.style.display!=="none"))return; // cartão aberto ou avulsa rodando
  const agoraMin=h*60+d.getMinutes();
  const ult=new Date(E._ultAtiv||Date.now());
  const ultMin=(ult.toDateString()===d.toDateString())?ult.getHours()*60+ult.getMinutes():9*60;
  const almoco=Math.max(0,Math.min(agoraMin,14*60)-Math.max(ultMin,12*60));
  const gap=agoraMin-ultMin-almoco;
  if(gap>=30)mostrarAlertaInativo(gap);}

async function concluirTarefa(){
  const t=E.atual,check=ge("conc-check").value,dm=ge("conc-data").value;

  if(t._impulso){
    if(confirm(`🤝 Esta tarefa é um IMPULSO delegado a você.\n\nO pedido está ATENDIDO?\n\nOK = Finalizar impulso (devolve ao dono com o seu retorno)\nCancelar = ainda não terminei — só reagendar para mim`)){
      await finalizarImpulso(t.id_tarefa);return;}

      toast("Antes de reagendar o impulso, registre um andamento — o dono precisa saber o que está acontecendo.","erro");return;}
  }
  if(t._impedimento&&!t.queda_impedimento_dt){
    toast("Antes de concluir, informe a data de queda do impedimento (campo no topo do cartão).","erro");
    editarQueda();return;}
  let avisoGrupo=false,avisoAdv=false;
  if(t.id_cliente&&!dispensaGrupo(t)){
    const cb=ge("conc-grupo"),ca=ge("conc-adv");
    avisoGrupo=!!(cb&&cb.checked);avisoAdv=!!(ca&&ca.checked);
    if(!avisoGrupo&&!avisoAdv){
      toast(ehLevantamento(t)
        ?"Para concluir, marque uma das caixinhas: informou no grupo do WhatsApp OU enviou o levantamento direto ao advogado."
        :"Para concluir, marque a caixinha confirmando que informou o movimento no grupo de atendimento do WhatsApp.","erro");return;}}
  // parecer/proposta comercial: portão com verificação REAL no banco —
  // ou existe proposta do cliente, ou lança agora, ou justifica por escrito
  if(String(t.operacao||"").includes("Proposta Comercial")&&!E._propGateOk){
    abrirGateProposta();return;}
  let prox;if(dm)prox=dm;else{const d=new Date();d.setDate(d.getDate()+(/SEMANAL/.test(check)?7:/MENSAL/.test(check)?30:1));prox=d.toISOString().slice(0,10);}
  if(!confirm(dm?`Concluir? A tarefa volta em ${brData(dm)}.`:`Concluir? Volta sozinha pela frequência (${check}).`))return;
  try{const contaC=minutosDaSessao(t);await DB.concluir(t,{check,proximo:prox});await DB.sessaoConcluir(contaC.min);
    if(contaC.nota)await DB.nota({id_tarefa:t.id_tarefa,id_cliente:t.id_cliente,tipo:"HISTORICO",texto:contaC.nota});

    else if(avisoAdv)await DB.nota({id_tarefa:t.id_tarefa,id_cliente:t.id_cliente,tipo:"HISTORICO",
      texto:"📤 Levantamento enviado direto ao advogado (sem aviso no grupo) ao concluir."});
    // prazo fatal já vencido + tarefa concluída = provavelmente cumprido: oferece
    // limpar (dias calculados na hora, direto da data — nada pré-calculado)
    const pfDiasAgora=diasAte(t.prazo_fatal_dt);
    if(t.prazo_fatal_dt&&pfDiasAgora!==null&&pfDiasAgora<=0
       &&confirm(`Esta tarefa tinha prazo fatal em ${brData(t.prazo_fatal_dt)} (já passou).\n\nO prazo foi CUMPRIDO? OK = sim, limpar o alerta.`)){

        hist_texto:`✅ Prazo fatal de ${brData(t.prazo_fatal_dt)} marcado como cumprido (na conclusão).`,hist_tipo:"HISTORICO"});}}
  catch(e){toast("Erro: "+e.message,"erro");return;}
  toast("Concluída!","ok");fecharModal();recarregar();}

// fecha a conta da sessão com as travas anti-esquecimento:
// - atravessou a noite / fora do expediente: teto de 60 min
// - pergunta sem resposta em horário normal: teto de 3× o tempo padrão
function minutosDaSessao(t){
  const bruto=E.timerIni?Math.round((Date.now()-E.timerIni)/60000):0;
  if(!E.timerIni||bruto<1)return{min:bruto,nota:null};
  const ini=new Date(E.timerIni),agora=new Date();
  const pad=tempoDe(t&&t.operacao);
  if(E._timerNegado&&bruto>pad)
    return{min:pad,nota:`⚠️ A pessoa avisou que já não estava na atividade (cartão aberto ${bruto} min). Tempo registrado: ${pad} min (padrão da operação); o restante foi descartado.`};
  const outroDia=ini.toDateString()!==agora.toDateString();
  const foraExp=agora.getHours()>=19||agora.getHours()<7;
  if((outroDia||foraExp)&&bruto>60)
    return{min:60,nota:`⚠️ Cartão ficou aberto ${bruto} min (atravessou o fim do expediente — provável esquecimento). Tempo registrado limitado a 60 min.`};
  const teto=3*tempoDe(t&&t.operacao);
  if(E._timerPergunta&&!E._timerConfirmado&&bruto>teto)
    return{min:teto,nota:`⚠️ Cartão aberto ${bruto} min sem resposta à confirmação de atividade. Tempo registrado limitado a ${teto} min (3× o padrão da operação).`};
  return{min:bruto,nota:null};
}

async function aprovarPacote(){

async function executarAprovacao(i,para,extras){
  const s=(E._sugestoesTodas||[])[i];if(!s)return;
  const desc=`Impulso sugerido pelo robô (dia de ${s.de} acima da capacidade) e aprovado pela head ${E.perfil.nome_sistema}. Executar e devolver o retorno.`;
  const quando=perguntarQuandoDelegar("IMEDIATO");
  try{await DB.delegar(s.t,{para:para,freq:"IMEDIATO",descricao:desc,quando});}
  catch(e){toast("Erro: "+e.message,"erro");return;}
  let nPac=0;
  for(const x of extras){
    try{await DB.delegar(x,{para:para,freq:"IMEDIATO",quando,descricao:desc+" (pacote do cliente — atualizar junto e devolver)"});nPac++;}
    catch(e){toast("Uma tarefa do pacote falhou: "+e.message,"erro");}}
  toast(`✓ Impulso criado: ${para} recebeu ${1+nPac} tarefa(s) do cliente.`,"ok");
  const idsPac=new Set(extras.map(x=>x.id_tarefa));idsPac.add(s.t.id_tarefa);
  E._sugestoesTodas=E._sugestoesTodas.filter(z=>!idsPac.has(z.t.id_tarefa));
  // desconto AO VIVO: cada tarefa delegada consome a folga do receptor agora
  const gasto=tempoPlanoDe(para,s.t.operacao)
    +extras.reduce((soma,x)=>soma+tempoPlanoDe(para,x.operacao),0);
  const rec=(E._sugComFolga||[]).find(x=>x.n===para);
  if(rec){rec.folga-=gasto;
    E._sugComFolga=E._sugComFolga.filter(x=>x.folga>=30);}
  desenhaSugestoes();
}

function filtraPainel(){
  const q=(ge("pf-q").value||"").toLowerCase(),a=ge("pf-ass").value,st=ge("pf-st").value,hd=ge("pf-hd").value;
  let f=E.tarefas.filter(t=>t.id_tarefa&&!t._delegada&&!t._emCorrecao);
  if(q)f=f.filter(t=>String(t.cliente||"").toLowerCase().includes(q));
  if(a)f=f.filter(t=>t.assessor===a);
  if(hd)f=f.filter(t=>t.advogada===hd);
  if(st==="atr")f=f.filter(t=>t._atrasada);
  if(st==="imed")f=f.filter(t=>t._g===1);
  if(st==="dia")f=f.filter(t=>!t._atrasada);
  f.sort((x,y)=>(x._dias??9999)-(y._dias??9999));
  ge("pf-lista").innerHTML=f.length?f.slice(0,150).map(t=>cardTarefa(t,true)).join("")
    +(f.length>150?`<div class="vazio">… e mais ${f.length-150} (use os filtros)</div>`:"")
    :`<div class="vazio">Nenhuma tarefa.</div>`;
}

  ge("conteudo").innerHTML=termometro+h;
}

async function telaPrevisao(mesRef){
  setNav("prev","Previsão Mensal"); carregando();
  let ops;try{ops=await DB.tarefas();}catch(e){return erro(e.message);}
  const ts=(ops||[]).map(classificar).filter(t=>t.id_tarefa&&!t._delegada);E.tarefas=ts;
  await carregarTemposReais(ts);  // tempos reais para o resumo por assessor no detalhe do dia
  const hoje=new Date();hoje.setHours(0,0,0,0);
  // mês visitado: "AAAA-MM" (navegação) ou o mês atual
  let ano,mes;
  if(typeof mesRef==="string"&&/^\d{4}-\d{2}$/.test(mesRef)){ano=+mesRef.slice(0,4);mes=+mesRef.slice(5,7)-1;}
  else{ano=hoje.getFullYear();mes=hoje.getMonth();}
  const mesAtual=(ano===hoje.getFullYear()&&mes===hoje.getMonth());
  const porDia={},chave=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const usoDia={},iniMes=new Date(ano,mes,1),fimMes=new Date(ano,mes+1,0);
  const poe=(k,t,tipo)=>{(porDia[k]=porDia[k]||[]).push({t,tipo});const a=t.assessor||"?";usoDia[k+a]=(usoDia[k+a]||0)+1;};
  // repetições previstas pela frequência (a partir de uma data-âncora),
  // pintando só os dias que caem DENTRO do mês visitado
  const repete=(t,dAncora)=>{const f=String(t.check_||"").toUpperCase();
    if(/DIÁRIO|DIARIO/.test(f)){const d=new Date(dAncora);d.setDate(d.getDate()+1);
      while(d<=fimMes){if(d>=iniMes&&d.getDay()!==0&&d.getDay()!==6)poe(chave(d),t,"recorrente");d.setDate(d.getDate()+1);}}
    else if(/SEMANAL/.test(f)){const d=new Date(dAncora);d.setDate(d.getDate()+7);
      while(d<=fimMes){if(d>=iniMes)poe(chave(d),t,"recorrente");d.setDate(d.getDate()+7);}}};
    // MENSAL: sem repetição projetada além da própria data
  // 1) tarefas com data DENTRO do mês visitado ficam no dia delas + repetições
  //    (repetições também entram vindas de âncoras de meses anteriores)
  const semData=[];
  ts.forEach(t=>{const dt=t.data_revisao_dt?new Date(t.data_revisao_dt+"T00:00:00"):null;
    if(dt&&dt>=iniMes&&dt<=fimMes&&(dt>=hoje||!mesAtual)){poe(chave(dt),t,"agendado");repete(t,dt);}
    else if(dt&&dt>hoje&&dt<iniMes){repete(t,dt);}          // âncora antes do mês → só repetições
    else if(!t._concluida&&(dt===null||dt<=hoje))semData.push(t);});
  // 2) sem data / atrasadas: só faz sentido no MÊS ATUAL (é a fila de agora);
  //    distribui pelos dias úteis respeitando o teto por assessor
  const capDiaDe=n=>Math.min(Math.floor(capDe(n)/20),10);
  let foraMes=0;
  if(mesAtual){
    const diasUteis=[];const dLoop=new Date(hoje);
    while(dLoop.getMonth()===mes){const w=dLoop.getDay();if(w!==0&&w!==6)diasUteis.push(chave(dLoop));dLoop.setDate(dLoop.getDate()+1);}
    semData.sort((a,b)=>(a._g-b._g)||((a._dias??9)-(b._dias??9)));
    semData.forEach(t=>{const a=t.assessor||"?";const teto=capDiaDe(a);
      for(const k of diasUteis){if((usoDia[k+a]||0)<teto){poe(k,t,"estimado");repete(t,new Date(k+"T00:00:00"));return;}}
      foraMes++;});
  }
  Object.values(porDia).forEach(l=>l.sort((a,b)=>({agendado:0,estimado:1,recorrente:2}[a.tipo]-{agendado:0,estimado:1,recorrente:2}[b.tipo])));
  E._prevDias=porDia;E._prevMeta={ano,mes,foraMes,mesAtual};
  if(!E._prevFiltro)E._prevFiltro="todos";
  desenhaPrevisao();
}

  const passa=t=>f==="todos"||primeiroNome(t.assessor||"")===f;

async function verDia(k){
  const f=E._prevFiltro||"todos";

  ge("m-titulo").textContent=`${d[2]}/${d[1]}/${d[0]}`+(f!=="todos"?` · ${f}`:"");
  ge("m-sub").textContent=`${lst.length} tarefa(s) prevista(s)`;
  // um bloco por assessor, na MESMA ordem que o sistema mostra para a pessoa
  // (urgência primeiro: imediatas → atrasadas → do dia → janela da semana/mês)
  const porAss={};lst.forEach(x=>{const a=primeiroNome(x.t.assessor||"?")||"?";(porAss[a]=porAss[a]||[]).push(x);});
  const tipoPeso={agendado:0,estimado:1,recorrente:2};
  const nomesDia=OPERACIONAIS.filter(a=>porAss[a]).concat(Object.keys(porAss).filter(a=>!OPERACIONAIS.includes(a)).sort());
  let h="";

    grupo.sort((x,y)=>((x.t._g??4)-(y.t._g??4))||((x.t._dias??9)-(y.t._dias??9))||(tipoPeso[x.tipo]-tipoPeso[y.tipo]));
    const semDono=(a==="?");
    const c=semDono?{bg:"var(--red-lt)",border:"var(--red)",text:"var(--red)"}:corDe(a);
    const min=grupo.reduce((s,x)=>s+tempoPlanoDe(a,x.t.operacao),0);
    h+=`<div style="background:${c.bg};border:1.5px solid ${c.border};border-radius:12px;padding:10px 12px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <b style="color:${c.text}">${semDono?"&#9888; Sem assessor definido — abra e redistribua":esc(a)}</b>
        <span style="font-size:11px;color:${c.text};font-weight:600">${grupo.length} tarefa(s) · &asymp;${fmtMin(min)}</span></div>
      ${grupo.map((x,i)=>{const rot=x.tipo==="agendado"?"data marcada":x.tipo==="estimado"?"estimado":"&#8635; recorrente";
        return `<div class="linha-item" style="cursor:pointer;background:white;border-radius:8px;margin-bottom:4px;padding:6px 10px" onclick="abrirTarefa('${esc(x.t.id_tarefa)}')">
        <span><b style="color:${c.text}">${i+1}.</b> ${esc(String(x.t.cliente||"").slice(0,42))} · ${esc(x.t.operacao||"")}${x.t._g===1?' <span class="tag ti">IMEDIATO</span>':x.t._g===2?' <span class="tag" style="background:var(--amber);color:white">atrasada</span>':""}</span>
        <span style="font-size:10px;color:var(--gray)">${rot}</span></div>`;}).join("")}
    </div>`;});
  if(!h)h=`<div class="vazio">Nada previsto.</div>`;

  ge("m-corpo").innerHTML=h;ge("modal").classList.add("aberto");
  clearInterval(E.timerInt);E.atual=null;E.timerIni=null;
  // dia de hoje/passado: mostra o que FOI feito
  if(k<=hojeISO()){const box=ge("dia-feito");box.innerHTML=`<div class="carregando"><div class="spin"></div></div>`;
    try{const hist=await DB.historicoDia(k);
      const por={};(hist||[]).forEach(r=>{const a=loginDe(r.autor);if(!a||a==="Sistema")return;
        (por[a]=por[a]||[]).push(r);});
      const ents=Object.entries(por);
      box.innerHTML=ents.length?`<div class="bloco-t" style="color:var(--dani)">&#10003; O que foi feito neste dia</div>`+
        ents.map(([n,rs])=>`<div class="painel" style="padding:9px 12px"><b style="color:var(--navy)">${esc(n)}</b> — ${rs.length} registro(s)
          ${rs.filter(r=>r.tipo!=="TIMER").slice(0,8).map(r=>`<div style="font-size:12px;color:#555;margin-top:3px">• ${esc(String(r.texto||"").slice(0,120))}</div>`).join("")}</div>`).join("")
        :`<div style="font-size:12px;color:var(--gray)">Nenhum andamento registrado neste dia.</div>`;}
    catch(e){box.innerHTML="";}}
}

function buscaPorOperacao(){
  const op=ge("cl-opsel").value;if(!op)return;
  const alvo=op.toLowerCase();

  const f=(E.tarefas||[]).filter(t=>t.id_tarefa&&String(t.operacao||"").toLowerCase().includes(alvo)
      &&(!adv||String(t.advogada||"").trim()===adv))
    .sort((a,b)=>(a._dias??9999)-(b._dias??9999));
  ge("cl-lista").innerHTML=`<p style="font-size:12px;color:var(--gray);margin-bottom:8px">${f.length} tarefa(s) de "${esc(op)}"${adv?` · advogada <b>${esc(adv)}</b>`:""} em andamento</p>`

function filtroCliente(c){
  if(E._fSit==="OFICIAL"&&String(c.situacao||"")==="PROSPECCAO")return false;
  if(E._fSit==="PROSPECCAO"&&String(c.situacao||"")!=="PROSPECCAO")return false;
  const rg=String(c.regime||"").toUpperCase();
  if(E._fReg==="CONFIRMAR"&&!rg.includes("CONFIRMAR")&&!rg.includes("⚠"))return false;
  if(E._fReg==="SIMPLES"&&rg!=="SIMPLES NACIONAL"&&rg!=="MEI")return false;
  if(E._fReg==="PR"&&!(rg.includes("PRESUMIDO")||rg.includes("REAL"))||(E._fReg==="PR"&&rg.includes("⚠")))return false;
  if(E._fReg==="SEM"&&rg!=="")return false;
  if(E._fAtivo==="SEM"&&E._temTarefa[c.id_cliente])return false;
  if(E._fAtivo==="COM"&&!E._temTarefa[c.id_cliente])return false;
  if(E._fAtivo==="MINHAS"&&!(E._minhaTarefa[c.id_cliente]
    ||loginDe(c.assessor_responsavel||"")===E.perfil.nome_sistema))return false;
  if(E._fAtivo==="SEMRESP"&&String(c.assessor_responsavel||"").trim()!=="")return false;
  return true;
}

async function salvarCadastroHead(id){

function buscaMescla(id){

async function mesclarCliente(fica,some){

async function salvarRespCliente(id){

function setSitProp(v){const s=ge("pp-sit");if(!s)return;s.value=v;
  if(v!=="todas"&&ge("pp-st"))ge("pp-st").value="";desenhaProps();}
function ajustaSitProp(){const st=ge("pp-st").value,s=ge("pp-sit");if(!s)return;
  if(st==="Aceita")s.value="aceitas";
  else if(st==="Recusada")s.value="recusadas";
  else if(st&&(s.value==="aceitas"||s.value==="recusadas"))s.value="ativas";}
function desenhaProps(){
  if(!E._props||!ge("pp-q"))return;   // tela de propostas não está aberta
  const q=(ge("pp-q").value||"").toLowerCase(),st=ge("pp-st").value,or=ge("pp-or").value,mi=ge("pp-mi")?ge("pp-mi").value:"";
  const meu=String(E.perfil.nome_sistema||"").trim().toLowerCase();
  // head/vendedor mexem em todas; executor e solicitante, nas próprias
  const podeMexerEm=p=>E.perfil.head_sim
    ||String(p.executor||"").trim().toLowerCase()===meu||String(p.quem_pediu||"").trim().toLowerCase()===meu;
  // filtro por pessoa (pedido da Bruna, 18/08/2026): vale quem é responsável
  // pela negociação OU quem pediu a proposta
  const daPessoa=(p,alvo)=>donoProp(p).toLowerCase()===alvo;
  const base=E._props.filter(p=>{
    if(!mi)return true;
    if(mi==="m")return daPessoa(p,meu);
    if(mi.indexOf("p:")===0)return daPessoa(p,mi.slice(2).trim().toLowerCase());
    return true;});
  if(ge("pp-s-tot")){ge("pp-s-tot").textContent=base.length;
    ge("pp-s-rua").textContent=base.filter(p=>!["Aceita","Recusada"].includes(p.status)).length;
    ge("pp-s-ace").textContent=base.filter(p=>p.status==="Aceita").length;
    if(ge("pp-s-per"))ge("pp-s-per").textContent=base.filter(p=>p.status==="Recusada").length;
    // valor e projeção olham só o que está NA RUA (aceitas/recusadas fora)

async function corrigirProposta(id){
  const p=E._propMap[id];if(!p)return;
  const vTxt=(ge("ng-fixval").value||"").trim(),cond=(ge("ng-fixcond").value||"").trim();
  const v=numBR(vTxt);
  const marcados=[...document.querySelectorAll(".ng-fixprod:checked")].map(x=>x.value);
  const outro=(ge("ng-fixprodoutro")?.value||"").trim().toUpperCase();
  if(outro)outro.split(",").map(x=>x.trim()).filter(Boolean).forEach(x=>{if(!marcados.includes(x))marcados.push(x);});
  const prodNovo=marcados.join(", ");
  const prodAntes=String(p.produtos||"").split(",").map(x=>x.trim()).filter(Boolean).join(", ");
  const mudouProd=prodNovo&&prodNovo!==prodAntes;
  if(mudouProd&&!marcados.length){toast("A proposta precisa ter ao menos um serviço.","erro");return;}
  if(!v&&!cond&&!mudouProd){toast("Informe o novo valor, a forma de pagamento e/ou ajuste os serviços.","erro");return;}
  const antes=`R$ ${p.valor||"—"} · ${p.cond_pagamento||"—"}`;
  const hora=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  const partes=[];
  if(v||cond)partes.push(`✏️ proposta corrigida para R$ ${vTxt||p.valor||"—"} · ${cond||p.cond_pagamento||"—"} (antes: ${antes})`);
  if(mudouProd)partes.push(`🧾 serviços corrigidos para ${prodNovo} (antes: ${prodAntes||"—"})`);
  const linha=`${brHoje()} ${hora} — ${E.perfil.nome_sistema}: ${partes.join(" · ")}`;
  try{const u={negociacao_log:linha+(p.negociacao_log?"\n"+p.negociacao_log:"")};
    if(v){u.valor=vTxt;u.valor_num=v;}
    if(cond)u.cond_pagamento=cond;
    if(mudouProd)u.produtos=prodNovo;
    okS(await supa.from("propostas").update(u).eq("id_proposta",id));}
  catch(e){toast("Erro: "+e.message,"erro");return;}
  if(v){p.valor=vTxt;p.valor_num=v;}
  if(cond)p.cond_pagamento=cond;
  if(mudouProd)p.produtos=prodNovo;
  p.negociacao_log=linha+(p.negociacao_log?"\n"+p.negociacao_log:"");
  toast("Proposta corrigida — registrado na linha do tempo.","ok");
  abrirNegociacao(id);desenhaProps();
}

  if(passo)ln+=" | ⏭ Próximo: "+passo;if(ret)ln+=" (retorno "+ret+")";if(perda)ln+=" | ✗ Motivo: "+perda;
  try{const r=await DB.negociacao({id_proposta:id,linha_log:ln,etapa,valor:val,cond,passo,retorno:ret,perda,
      valor_mes:vmes||null,data_pagto:dpag||null});

const fmtR$=v=>"R$ "+(+v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
async function telaComercial(){
  setNav("com",E.perfil.head_sim?"Comercial":"Meu Comercial"); carregando();
  const mes=hojeISO().slice(0,7)+"-01";
  const mesNome=new Date(mes+"T12:00:00").toLocaleDateString("pt-BR",{month:"long",year:"numeric"}).toUpperCase();
  let pags=[],metas=[],fechs=[],props=[];
  try{pags=await DB.comercialPagamentos(mes);}catch(e){}
  try{metas=await DB.metasMes(mes);}catch(e){}
  try{fechs=await DB.fechamentos();}catch(e){}
  try{props=await DB.propostas();}catch(e){}
  const ehHead=!!E.perfil.head_sim,eu=E.perfil.nome_sistema;
  const calc=n=>{
    const mrow=metas.find(m=>m.pessoa===n)||{};
    const meus=pags.filter(p=>p.credito===n);
    const pago=meus.filter(p=>p.status==="PAGO").reduce((s,p)=>s+(+p.valor_liquido||0),0);
    const novos=meus.filter(p=>p.status==="PAGO"&&p.tipo==="NOVO").reduce((s,p)=>s+(+p.valor_liquido||0),0);
    const nNovos=meus.filter(p=>p.status==="PAGO"&&p.tipo==="NOVO").length;
    const nRec=meus.filter(p=>p.status==="PAGO"&&p.tipo!=="NOVO").length;
    const proj=meus.filter(p=>p.status&&p.status!=="PAGO"&&!p.fora_projecao&&p.status.indexOf("CANCEL")===-1)
      .reduce((s,p)=>s+(+p.valor_bruto||0),0);
    const mProps=minhasNaRua(props,n);
    let emNeg=0,nNeg=0;
    mProps.forEach(p=>{const v=+(p.valor_mes||0);if(!v)return;
      const d=String(p.data_pagto_prevista||"").slice(0,7);
      if(!d||d===mes.slice(0,7)){emNeg+=v;nNeg++;}});
    const meta=+(mrow.meta||0);
    const minhasRua=propostasDe(props,n);
    const ruaTotal=minhasRua.reduce((s,p)=>s+(+p.valor_num||0),0);
    const esperado=ruaTotal*TAXA_FECHAMENTO_MERCADO;
    const faltaBuscar=Math.max(0,meta-pago-proj-esperado);
    return {meta,liberada:!!mrow.liberada,pago,novos,rec:pago-novos,nNovos,nRec,proj,
      emNeg,nNeg,nProps:mProps.length,falta:Math.max(0,meta-pago),
      nRua:minhasRua.length,ruaTotal,esperado,faltaBuscar,
      cob:meta>0?Math.round((pago+emNeg)/meta*100):null};
  };
  const linB2=(rot,val,forte)=>`<tr style="border-top:1px solid var(--gray-lt)">
    <td style="padding:5px 8px">${rot}</td>
    <td style="text-align:right;padding:5px 8px;font-family:\'DM Mono\'${forte?";font-weight:700;color:var(--navy)":""}">${val}</td></tr>`;
  const blocoB2=(c,liberadaOk)=>`<div class="bloco-t" style="margin-top:4px">Bloco 2 — Acompanhamento do mês em curso</div>
    <div style="overflow-x:auto"><table style="min-width:360px;width:100%;max-width:560px;border-collapse:collapse;font-size:12.5px">
    ${linB2("Valor da meta alvo",liberadaOk?fmtR$(c.meta):"&#128274; aguardando liberação")}
    ${linB2("Valor da projeção (pago + boletos na rua)",fmtR$(c.pago+c.proj))}
    ${linB2("Valor já pago no mês",fmtR$(c.pago),1)}
    ${linB2("Valor da projeção excluindo os pagos",fmtR$(c.proj))}
    ${linB2("Valor que falta para atingir a meta alvo",liberadaOk?fmtR$(c.falta):"&#128274;")}
    ${linB2("Número de propostas em negociação",c.nNeg)}
    ${linB2("Valor total em negociação (pagamento no mês em curso)",fmtR$(c.emNeg))}
    ${linB2("Cobertura da meta alvo (pago + negociação)",liberadaOk&&c.cob!==null?c.cob+"%":"—",1)}
    </table></div>
    <div style="font-size:11px;color:var(--gray);margin:4px 0 8px">Tudo automático: pago em R$ líquido da planilha (${c.nNovos} novo(s) ${fmtR$(c.novos)} · ${c.nRec} recorrência ${fmtR$(c.rec)}); projeção = aceito com boleto na rua; negociação = propostas com previsão de pagamento neste mês (${c.nNeg} de ${c.nProps} na rua).</div>`;
  const blocoB1=nome=>{
    const mine=fechs.filter(f=>f.pessoa===nome)
      .sort((a,b)=>String(a.mes).localeCompare(String(b.mes)));
    if(!mine.length)return "";
    const mLbl=f=>new Date(String(f.mes).slice(0,10)+"T12:00:00")
      .toLocaleDateString("pt-BR",{month:"long"}).replace(/^./,x=>x.toUpperCase());
    const tk=(v,n)=>(+n>0)?fmtR$((+v||0)/+n):"—";
    const temN=f=>f.n_rec!==null&&f.n_rec!==undefined;
    const rowsB1=[
      ["Valor da meta",f=>f.meta!==null&&f.meta!==undefined?fmtR$(f.meta):"—"],
      ["Valor da projeção",f=>fmtR$(f.projecao)],
      ["Valor atingido",f=>fmtR$(f.atingido),1],
      ["Valor da recorrência",f=>f.recorrencia!=null?fmtR$(f.recorrencia):"—"],
      ["Número de negócios recorrentes",f=>temN(f)?f.n_rec:"—"],
      ["Ticket médio dos negócios recorrentes",f=>temN(f)?tk(f.recorrencia,f.n_rec):"—"],
      ["Valor de novos negócios",f=>f.novos!=null?fmtR$(f.novos):"—"],
      ["Número de novos negócios",f=>f.n_novos!=null?f.n_novos:"—"],
      ["Ticket médio dos novos negócios",f=>f.n_novos!=null?tk(f.novos,f.n_novos):"—"],
      ["Número total de negócios pagos (recorrentes + novos)",f=>temN(f)?(+f.n_rec||0)+(+f.n_novos||0):"—"],
      ["Ticket médio do valor atingido",f=>temN(f)?tk(f.atingido,(+f.n_rec||0)+(+f.n_novos||0)):"—"]];
    return `<div class="painel"><div class="bloco-t">Bloco 1 — Análise dos meses anteriores</div>
      <div style="overflow-x:auto"><table style="min-width:360px;width:100%;max-width:720px;border-collapse:collapse;font-size:12.5px">
      <tr style="color:var(--gray)"><th style="text-align:left;padding:4px 8px">Indicador</th>${mine.map(f=>`<th style="text-align:right;padding:4px 8px">${mLbl(f)}</th>`).join("")}</tr>
      ${rowsB1.map(([rot,fn,forte])=>`<tr style="border-top:1px solid var(--gray-lt)">
        <td style="padding:4px 8px">${rot}</td>${mine.map(f=>`<td style="text-align:right;padding:4px 8px;font-family:\'DM Mono\'${forte?";font-weight:700;color:var(--navy)":""}">${fn(f)}</td>`).join("")}</tr>`).join("")}
      </table></div>
      <div style="font-size:11px;color:var(--gray);margin-top:4px">A tabela acumula todos os meses, com recorrência × novos, contagens e tickets calculados dos pagamentos reais da planilha. O robô congela o fechamento de cada mês sozinho no 1º dia útil do mês seguinte.</div></div>`;
  };
  const blocoOrigem=(naRua,sufixo)=>{
    if(!naRua.length)return "";
    const porOrig={};naRua.forEach(p=>{const o=p.origem||"(sem origem)";
      (porOrig[o]=porOrig[o]||{n:0,v:0});porOrig[o].n++;porOrig[o].v+=(+p.valor_num||0);});
    const totV=Object.values(porOrig).reduce((s,x)=>s+x.v,0);
    return `<div class="painel"><div class="bloco-t">&#128506; Origem das propostas na rua${sufixo}</div>`+
      Object.entries(porOrig).sort((a,b)=>b[1].v-a[1].v).map(([o,x])=>`<div class="linha-item">
        <span>${esc(o)}</span><span style="font-size:12px">${x.n} proposta(s) · ${fmtR$(x.v)}${totV?` · ${Math.round(x.v/totV*100)}%`:""}</span></div>`).join("")+`</div>`;
  };
  const visualMes=(c,liberadaOk)=>{
    if(!liberadaOk||!(c.meta>0))return "";
    const pc=v=>Math.max(0,Math.min(100,v/c.meta*100));
    const wPago=pc(c.pago),wProj=Math.min(pc(c.proj),100-wPago),
          wEsp=Math.min(pc(c.esperado),Math.max(0,100-wPago-wProj));
    return `<div style="background:#F0F5F8;border-radius:12px;padding:11px 14px;margin-bottom:10px">
      <div style="display:flex;height:22px;border-radius:11px;overflow:hidden;background:#CBE0EA">
        <div style="width:${wPago}%;background:var(--green)" title="pago"></div>
        <div style="width:${wProj}%;background:var(--navy)" title="boletos na rua"></div>
        <div style="width:${wEsp}%;background:var(--amber)" title="propostas (taxa de mercado)"></div></div>
      <div class="sg" style="margin-top:9px">
        <div class="sc"><div class="sl">&#9989; Pago</div><div class="sv green" style="font-size:14px">${fmtR$(c.pago)}</div></div>
        <div class="sc"><div class="sl">&#128196; Boletos na rua</div><div class="sv" style="font-size:14px">${fmtR$(c.proj)}</div></div>
        <div class="sc"><div class="sl">&#128221; Propostas devem render</div><div class="sv amber" style="font-size:14px">~${fmtR$(c.esperado)}</div></div>
        <div class="sc" style="background:${c.faltaBuscar>0?"var(--red-lt)":"var(--green-lt)"}"><div class="sl">&#127919; Falta BUSCAR</div><div class="sv ${c.faltaBuscar>0?"red":"green"}" style="font-size:15px">${c.faltaBuscar>0?fmtR$(c.faltaBuscar):"meta coberta!"}</div></div></div>
      <div style="font-size:11px;color:var(--gray);margin-top:5px">${c.nRua} proposta(s) na rua trabalhando para você (suas + as que você pediu), somando ${fmtR$(c.ruaTotal)} — na taxa média de fechamento do mercado (${Math.round(TAXA_FECHAMENTO_MERCADO*100)}%), devem virar ~${fmtR$(c.esperado)}. Falta buscar = meta − pago − boletos − esse esperado.</div></div>`;
  };
  const visaoPessoal=(nome,liberadaOk)=>{
    const cP=calc(nome);
    let hh=visualMes(cP,liberadaOk)+blocoB2(cP,liberadaOk)+`</div>`;
    hh+=blocoB1(nome);
    hh+=blocoOrigem(minhasNaRua(props,nome),nome===eu?"":" — "+esc(nome));
    return hh;
  };
  // 🏆 Placar da semana — Programa de Engajamento (público para a equipe)
  let placarHtml="";
  try{
    const pl=await DB.placar();
    if((pl||[]).length){
      const cc=coroaCriterio();E._critRotulo=cc.rotulo;
      let reinado=null;try{reinado=await DB.coroaAtual();}catch(e){}
      let desafio=null;try{desafio=await DB.desafioSemana();}catch(e){}
      // fichas extras: coroa da semana (se ainda não girada) e desafio-relâmpago
      const fichasCom=r=>fichasSemana(r)
        +((reinado&&reinado.pessoa===r.pessoa&&!reinado.ficha_usada)?1:0)
        +((desafio&&desafio.vencedor===r.pessoa)?1:0);
      const ordF=[...pl].sort((a,b)=>fichasCom(b)-fichasCom(a)||(+b.valor_novos)-(+a.valor_novos));
      // empate no critério da semana → decide o MAIOR VALOR (Bruna, 25/08)
      const ordC=[...pl].sort((a,b)=>cc.medir(b)-cc.medir(a)||(+b.valor_novos)-(+a.valor_novos));
      const lider=(cc.crit!==2&&ordC[0]&&cc.medir(ordC[0])>0)?ordC[0]:null;
      placarHtml=`<div class="painel" style="background:linear-gradient(135deg,#2C6E8A,#447F98);color:white">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
          <b>&#127942; Placar da semana — Programa de Engajamento</b>
          <span style="font-size:11px;opacity:.85">semana ${cc.semanaMes} do mês · corte oficial: sexta 15h</span></div>
        <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:8px">${ordF.map((r,i)=>
          `<span style="background:rgba(255,255,255,${fichasCom(r)>0?".22":".10"});border-radius:10px;padding:5px 11px;font-size:12px${i===0&&fichasCom(r)>0?";outline:2px solid #FFD966":""}">
          &#127903;&#65039; <b>${fichasCom(r)}</b> ${esc(r.pessoa)}${reinado&&reinado.pessoa===r.pessoa?" &#128081;":""}${r.recorrencia_ok?' <span title="carteira em dia — ficha provável na sexta" style="font-size:10px">&#128176;&#10003;</span>':""}</span>`).join("")}</div>
        ${reinado?`<div style="background:rgba(255,217,102,.25);border:1px solid #FFD966;border-radius:10px;padding:7px 12px;margin-top:9px;font-size:12.5px">
          &#128081; <b>Coroado(a) da semana: ${esc(reinado.pessoa)}</b> — sistema dourado até sexta${reinado.ficha_usada?" · <span style=\'opacity:.85\'>ficha da coroa já girada na roleta</span>":" e +1 ficha"} <span style="opacity:.8">(critério: ${esc(reinado.criterio||"—")})</span></div>`:""}
        ${desafio?`<div style="background:rgba(255,255,255,.15);border:1px dashed rgba(255,255,255,.6);border-radius:10px;padding:7px 12px;margin-top:8px;font-size:12.5px">
          &#9889; <b>${esc(desafio.nome)}</b> — ${esc(desafio.descricao||"")}${desafio.vencedor
            ?`<br>&#127937; <b>Conquistado por ${esc(desafio.vencedor)}!</b> (${fmtR$(+desafio.valor)} · ${new Date(desafio.quando).toLocaleString("pt-BR",{weekday:"short",hour:"2-digit",minute:"2-digit"})}) — ficha extra já no placar`
            :" · <span style=\'opacity:.85\'>ainda em aberto — corre!</span>"}</div>`:""}
        <div style="background:rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;margin-top:9px;font-size:12.5px">
          &#128081; <b>Corrida da PRÓXIMA coroa: ${cc.rotulo}</b> <span style="opacity:.85">(${cc.desc})</span><br>
          ${lider?`Na frente agora: <b>${esc(lider.pessoa)}</b> — ${cc.fmt(lider)}${ordC[1]&&cc.medir(ordC[1])>0?` · na cola: ${esc(ordC[1].pessoa)} (${cc.fmt(ordC[1])})`:""} <span style="opacity:.8">· o líder vê o sistema coroado em dourado &#128081;</span>`
            :"Decidida por votação anônima na sexta — quem mais ajudou o time."}</div>
        <div style="overflow-x:auto;margin-top:8px"><table style="width:100%;border-collapse:collapse;font-size:11.5px;color:white">
          <tr style="opacity:.75;text-align:right"><th style="text-align:left;padding:3px 6px">#</th><th style="text-align:left">Pessoa</th><th>&#127903;&#65039; Fichas</th><th>Novos</th><th>R$ novos</th><th>Concluídas</th><th>Carteira</th></tr>
          ${ordF.map((r,i)=>`<tr style="border-top:1px solid rgba(255,255,255,.25);text-align:right${lider&&r.pessoa===lider.pessoa?";background:rgba(255,217,102,.28)":""}">
            <td style="text-align:left;padding:3px 6px">${i+1}º</td>
            <td style="text-align:left"><b>${esc(r.pessoa)}</b>${reinado&&r.pessoa===reinado.pessoa?" &#128081;":(lider&&r.pessoa===lider.pessoa?" <span style=\'opacity:.8\'>&#128081;?</span>":"")}</td>
            <td><b>${fichasCom(r)}</b></td><td>${r.novos||0}</td><td>${fmtR$(+r.valor_novos||0)}</td>
            <td>${r.conclusoes||0}</td><td>${r.recorrencia_ok?"&#10003;":"&#9888;&#65039;"}</td></tr>`).join("")}
        </table></div>
        ${ehHead?`<div class="linha-acao" style="margin-top:8px">
          <select class="fsel" id="pl-coroar" style="min-width:140px">${ordC.map((r,i)=>`<option ${i===0?"selected":""}>${esc(r.pessoa)}</option>`).join("")}</select>
          <button class="btn btsm" style="background:#FFD966;color:#5A4500;font-weight:700" onclick="coroarAgora()">&#128081; Coroar (reina a próxima semana)</button></div>`:""}
        <div style="font-size:10px;opacity:.75;margin-top:5px">&#127903;&#65039; = SÓ contratos novos PAGOS na semana (1 cada). O selo &#128176;&#10003; indica carteira em dia — essa ficha só nasce na sexta às 15h, se a semana fechar sem atraso. Indicação em dobro, contador novo, reativação e voto do time são somados pelo responsável no quadro da sexta.</div></div>`;
    }
  }catch(e){}
  let h;
  if(!ehHead){
    const c=calc(eu);
    h=placarHtml+`<div class="painel"><div class="bloco-t">&#128188; Comercial — ${esc(mesNome)}</div>`;
    if(!c.liberada)h+=`<div class="aviso info" style="margin-bottom:8px">&#128274; A meta deste mês ainda não foi liberada pelas heads — os demais números já são ao vivo.</div>`;
    h+=visaoPessoal(eu,c.liberada);
  }else{
    // heads: Equipe (geral) · Meu Comercial · cada pessoa em tempo real
    const alvo=E._comAlvo||"__EQUIPE__";
    const pessoas=[...new Set([...metas.map(m=>m.pessoa),...pags.map(p=>p.credito).filter(Boolean),
      ...fechs.map(f=>f.pessoa)])].filter(Boolean).sort((a,b)=>a.localeCompare(b));
    const rotAlvo=alvo==="__EQUIPE__"?"Equipe":(alvo===eu?"Meu Comercial":esc(alvo));
    h=placarHtml+`<div class="painel"><div class="bloco-t">&#128188; Comercial — ${rotAlvo} — ${esc(mesNome)}</div>
      <div class="linha-acao" style="margin-bottom:8px;align-items:center">
        <select class="fsel" id="com-alvo" onchange="E._comAlvo=this.value;telaComercial()">
          <option value="__EQUIPE__" ${alvo==="__EQUIPE__"?"selected":""}>&#128101; Equipe (geral)</option>
          <option value="${esc(eu)}" ${alvo===eu?"selected":""}>&#128188; Meu Comercial (${esc(eu)})</option>
          ${pessoas.filter(p=>p!==eu).map(p=>`<option ${alvo===p?"selected":""}>${esc(p)}</option>`).join("")}</select>
        <span style="font-size:11px;color:var(--gray)">escolha alguém para ver, em tempo real, exatamente os quadros que a pessoa vê</span></div>`;
    if(alvo!=="__EQUIPE__"){
      const c=calc(alvo);
      if(alvo!==eu)h+=`<div class="aviso info" style="margin-bottom:6px">Visão espelho de <b>${esc(alvo)}</b>${c.liberada?"":" — a meta ainda está &#128274; para a pessoa (você vê por ser head)"}.</div>`;
      h+=visaoPessoal(alvo,true);
    }else{
      const linhas=pessoas.map(n=>({n,c:calc(n)})).sort((a,b)=>b.c.meta-a.c.meta||b.c.pago-a.c.pago);
      const tot=linhas.reduce((t,l)=>{["meta","pago","novos","rec","proj","emNeg"].forEach(k=>t[k]=(t[k]||0)+l.c[k]);return t;},{});
      tot.cob=tot.meta>0?Math.round((tot.pago+tot.emNeg)/tot.meta*100):null;
      const totV={...tot,esperado:linhas.reduce((s,l)=>s+l.c.esperado,0),
        ruaTotal:linhas.reduce((s,l)=>s+l.c.ruaTotal,0),nRua:linhas.reduce((s,l)=>s+l.c.nRua,0)};
      totV.faltaBuscar=Math.max(0,totV.meta-totV.pago-totV.proj-totV.esperado);
      h+=visualMes(totV,true);
      h+=blocoB2({...tot,falta:Math.max(0,tot.meta-tot.pago),nNovos:linhas.reduce((s,l)=>s+l.c.nNovos,0),
        nRec:linhas.reduce((s,l)=>s+l.c.nRec,0),nNeg:linhas.reduce((s,l)=>s+l.c.nNeg,0),
        nProps:linhas.reduce((s,l)=>s+l.c.nProps,0),liberada:true,cob:tot.cob},true);
      const foraProj=pags.filter(p=>p.fora_projecao).reduce((s,p)=>s+(+p.valor_bruto||0),0);
      h+=`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">
        <tr style="color:var(--gray);text-align:right"><th style="text-align:left">Pessoa</th><th>Meta</th><th>Pago</th><th>Novos</th><th>Recorr.</th><th>Projeção</th><th>Em neg. (mês)</th><th>Cobertura</th></tr>`+
        linhas.map(l=>`<tr style="border-top:1px solid var(--gray-lt);text-align:right">
          <td style="text-align:left;padding:5px 0"><a href="javascript:void(0)" onclick="E._comAlvo=${JSON.stringify(l.n)};telaComercial()" style="color:var(--navy);font-weight:700">${esc(l.n)}</a>${l.c.liberada?"":' <span title="meta ainda não liberada">&#128274;</span>'}</td>
          <td>${fmtR$(l.c.meta)}</td><td style="color:var(--green)"><b>${fmtR$(l.c.pago)}</b></td>
          <td>${fmtR$(l.c.novos)}</td><td>${fmtR$(l.c.rec)}</td><td>${fmtR$(l.c.proj)}</td>
          <td>${fmtR$(l.c.emNeg)}</td><td><b>${l.c.cob!==null?l.c.cob+"%":"—"}</b></td></tr>`).join("")+
        `</table></div>
        <div style="font-size:11px;color:var(--gray);margin-top:6px">Clique no nome para abrir a visão da pessoa · &#128683; Fora da projeção (crônicos): <b>${fmtR$(foraProj)}</b></div>
        <div class="linha-acao" style="margin-top:8px"><button class="btn btp btsm" onclick="telaConfig()">&#9881;&#65039; Ajustar / liberar metas do mês</button></div></div>`;
      // retrovisor consolidado da banca
      const porMes={};fechs.forEach(f=>{(porMes[String(f.mes).slice(0,7)]=porMes[String(f.mes).slice(0,7)]||[]).push(f);});
      const mesesOrd=Object.keys(porMes).sort((a,b)=>b.localeCompare(a));
      if(mesesOrd.length){
        h+=`<div class="painel"><div class="bloco-t">&#128200; Retrovisor — fechamentos mensais da banca</div>
          <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">
          <tr style="color:var(--gray);text-align:right"><th style="text-align:left">Mês / pessoa</th><th>Meta</th><th>Projeção</th><th>Atingido</th><th>%</th></tr>`+

  const hoje=new Date();hoje.setHours(0,0,0,0);
  const seg=new Date(hoje);seg.setDate(hoje.getDate()-((hoje.getDay()+6)%7));
  const dias=[];for(let i=0;i<7;i++){const d=new Date(seg);d.setDate(seg.getDate()+i);dias.push(d);}
  const chave=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const nomes=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];

  // projeção da semana: além das tarefas com data marcada, distribui as
  // atrasadas/sem data pelos dias úteis respeitando o teto diário (igual à Previsão)
  const kHoje=chave(hoje);
  const teto=Math.min(Math.floor(capDe(E.perfil.nome_sistema)/20),10);
  const fixasDia={},usoDia={};
  dias.forEach(d=>{const k=chave(d);
    fixasDia[k]=ts.filter(t=>String(t.data_revisao_dt||"").slice(0,10)===k&&!t._concluida);
    usoDia[k]=fixasDia[k].length;});
  const estimDia={};dias.forEach(d=>estimDia[chave(d)]=[]);
  const pend=ts.filter(t=>{if(t._concluida||t._delegada||t._emCorrecao)return false;
    const dr=String(t.data_revisao_dt||"").slice(0,10);return !dr||dr<kHoje;})
    .sort((a,b)=>(a._g-b._g)||((a._dias??9)-(b._dias??9)));
  pend.forEach(t=>{for(const d of dias){const k=chave(d);

  dias.forEach((d,i)=>{const k=chave(d),ehHoje=d.getTime()===hoje.getTime();
    const reuDia=minhasReu.filter(r=>String(r.data_dt||"").slice(0,10)===k);
    const tarDia=fixasDia[k],estDia=estimDia[k]||[];
    const pins=tarDia.map(t=>({t,est:false})).concat(estDia.map(t=>({t,est:true})));
    grade+=`<div class="cald ${ehHoje?"hoje":""}">

      ${reuDia.map(r=>`<div class="calpin" style="background:#EFF6FF;border-left-color:var(--dani)">&#128197; ${esc(r.titulo)}</div>`).join("")}
      ${pins.slice(0,3).map(({t,est})=>`<div class="calpin" style="${est?"opacity:.65;border-left-style:dashed":""}">&#128203; ${esc(String(t.cliente||"").split(" ")[0])}</div>`).join("")}
      ${pins.length>3?`<div style="color:var(--dani);font-weight:700">+${pins.length-3}</div>`:""}</div>`;});
  grade+=`</div>
  <div style="font-size:11px;color:var(--gray);margin-top:4px">Cheio = data marcada · tracejado = estimado pela sua capacidade (até ${teto}/dia)</div>`;
  const hojeK=chave(hoje);
  const reuHoje=minhasReu.filter(r=>String(r.data_dt||"").slice(0,10)===hojeK)
    .sort((a,b)=>String(a.horario||"").localeCompare(String(b.horario||"")));
  const tarHoje=ts.filter(t=>t._g>=1&&t._g<=3&&!t._emCorrecao&&!t._delegada);
  let h=`<div class="linha-acao" style="margin-bottom:10px"><button class="btn btp btsm" onclick="abrirReuniao()">+ Reunião / compromisso</button></div>`;
  h+=grade;
  h+=`<div style="display:grid;grid-template-columns:280px 1fr;gap:12px;margin-top:14px" class="ag-cols">
    <div><div class="bloco-t">&#128197; Compromissos hoje</div>
    ${reuHoje.length?reuHoje.map(r=>`<div class="linha-item"><span><b>${esc(r.horario||"—")}</b> ${esc(r.titulo)}${r.cliente?"<br><span style='font-size:11px;color:var(--gray)'>"+esc(r.cliente)+"</span>":""}</span>
      <span>${esc(r.duracao_min||30)}min <button class="btn bts btsm" onclick='removerReuniao(${JSON.stringify(r.id_reuniao)})'>&#10005;</button></span></div>`).join("")
      :`<div style="font-size:12px;color:var(--gray)">Sem compromissos hoje.</div>`}</div>
    <div><div class="bloco-t">&#128203; Tarefas de hoje (${tarHoje.length})</div>

  ge("conteudo").innerHTML=h;

async function telaProdutividade(){
  setNav("prod","Minha Produtividade"); carregando();
  let hist,ops,casos;try{[hist,ops,casos]=await Promise.all([DB.historicoHoje(),DB.tarefas(),DB.casos().catch(()=>[])]);}catch(e){return erro(e.message);}
  const meu=(hist||[]).filter(r=>ehMeuNome(r.autor));
  const mapa={};(ops||[]).forEach(t=>{if(t.id_tarefa)mapa[t.id_tarefa]=t;});
  // tarefa encerrada hoje já saiu do quadro ativo — o nome do cliente vem
  // do arquivo de Casos Encerrados
  const mapaEnc={};(casos||[]).forEach(c=>{const k=c.id_tarefa_origem||c.id_tarefa;if(k)mapaEnc[k]=c;});
  const tarefas={};let updates=0,min=0;
  meu.forEach(r=>{let k=r.id_tarefa||"—",descAv=null;
    // avulsa: mostra o título digitado pela pessoa (uma linha por atividade)
    if(k==="AVULSA"){descAv=((String(r.texto||"").match(/—\s*⏱️\s*([\s\S]+)$/)||[])[1]||"").trim();
      if(descAv)k="AVULSA|"+descAv;}
    const t=tarefas[k]=tarefas[k]||{cliente:"",op:"",and:[],min:0};
    if(descAv)t.cliente="⏱️ "+descAv;
    if(r.tipo==="TIMER"){const m=parseInt((String(r.texto||"").match(/(\d+)/)||[0,0])[1]);min+=m;t.min+=m;}
    else{updates++;if(r.texto)t.and.push(r.texto);}
    const mt=mapa[k],enc=mapaEnc[k];
    if(mt){t.cliente=mt.cliente;t.op=mt.operacao||"";}
    else if(enc){t.cliente=enc.cliente||"";t.op=enc.operacao||"";t.enc=true;}
    else if(String(k).includes("FIX"))t.cliente="📌 Tarefa fixa";
    else if(String(k).startsWith("AVULSA")&&!t.cliente)t.cliente="⏱️ Atividade avulsa";
    else if(k==="REUNIAO")t.cliente="📅 Reunião";});
  const lista=Object.entries(tarefas);
  // concluídas = carimbos do próprio dia no histórico (concluir grava o status
  // AGUARDANDO no quadro, então o status não serve de régua) + impulsos
  // devolvidos; cada tarefa/impulso conta uma vez
  const vistoC=new Set();
  meu.forEach(r=>{const tx=String(r.texto||"");
    if(/^Tarefa concluída pelo site/.test(tx))vistoC.add("C|"+r.id_tarefa);
    const mi=tx.match(/📥 Retorno do impulso \((OP-\d+)\)/);if(mi)vistoC.add("I|"+mi[1]);});
  const concl=vistoC.size;
  // encerradas (arquivadas hoje) contam num quadro próprio — encerrar é
  // desfecho definitivo, diferente de concluir (que volta pela frequência)
  const vistoE=new Set();
  meu.forEach(r=>{if(r.tipo==="ENCERRAMENTO")vistoE.add(r.id_tarefa);});
  const ence=vistoE.size;
  ge("conteudo").innerHTML=`<div class="sg">
    <div class="sc"><div class="sl">Andamentos hoje</div><div class="sv">${updates}</div></div>
    <div class="sc"><div class="sl">Tarefas tocadas</div><div class="sv">${lista.length}</div></div>
    <div class="sc"><div class="sl">Tempo hoje</div><div class="sv green pq">${fmtMin(min)}</div></div>
    <div class="sc"><div class="sl">Concluídas</div><div class="sv green">${concl}</div></div>
    <div class="sc"><div class="sl">Encerradas (arquivadas)</div><div class="sv">${ence}</div></div></div>
    <div class="bloco-t">O que você trabalhou hoje</div>`+
    (lista.length?lista.map(([k,t])=>`<div class="painel" style="padding:11px 14px">
      <div style="font-weight:700;color:var(--navy)">${esc(t.cliente||"Tarefa "+k)}${t.enc?' <span class="tag" style="background:#455A64;color:white">&#128193; ENCERRADA</span>':""}</div>
      <div style="font-size:11px;color:var(--gray)">${esc(t.op||"")}${t.min?" · "+t.min+"min":""}</div>
      ${t.and.map(a=>`<div style="font-size:12px;color:#555;margin-top:4px">• ${esc(a)}</div>`).join("")}</div>`).join("")
      :`<div class="vazio">Nenhum registro hoje ainda. Abra uma tarefa ou registre um andamento. &#128170;</div>`);
}

// "delega para" (pedido da Bruna, 12/08/2026: João, Laura e Thiago —
// nunca Malu, Ygor e Madu); demais perfis seguem com todos os operacionais
function alvosCriacao(){
  const p=E.perfil||{};
  if(!/vendedor|comercial/i.test(p.cargo||""))return OPERACIONAIS;
  const l=DELEGA_PARA[p.nome_sistema]||[];
  return l.length?l.filter(n=>OPERACIONAIS.includes(n)):["João","Laura","Thiago"].filter(n=>OPERACIONAIS.includes(n));
}
// quem recebe tarefa nova: ranking pelo peso das frequências (pedido da
// Bruna, 18/08/2026) — score = 5×diárias + 2×semanais + total de ativas;
// menor score primeiro. Madu (advogada) fica FORA da recomendação para
// tarefas operacionais — só entra por escolha explícita (venda direta dela).
async function ordenarReceptores(selId){
  const sel=ge(selId);if(!sel)return;
  let cg=[];try{cg=await DB.cargaEquipe();}catch(e){return;}
  if(!(cg||[]).length)return;
  const lista=alvosCriacao();
  const info=n=>(cg||[]).find(r=>loginDe(r.nome)===n)||null;
  const score=n=>{const c=info(n);
    return c?((+c.n_diarias||0)*5+(+c.n_semanais||0)*2+(+c.total_ativas||0)):99999;};
  const maduFora=lista.includes("Madu");
  const ord=[...lista].filter(n=>!(maduFora&&n==="Madu")).sort((a,b)=>score(a)-score(b));
  if(maduFora)ord.push("Madu");
  const atual=sel.value;
  sel.innerHTML=ord.map((n,i)=>{const c=info(n);
    const det=c?` — ${c.total_ativas} ativas · ${c.n_diarias} diárias · ${c.n_semanais} semanais`:"";
    const rot=(n==="Madu"&&maduFora)?`${n} (advogada — só tarefas diretas das heads)`
      :`${n}${det}${i===0?" ✓ recomendado":""}`;
    return `<option value="${esc(n)}">${esc(rot)}</option>`;}).join("");
  if(atual&&ord.includes(atual))sel.value=atual;
}

// envia os anexos escolhidos na criação (um a um; avisa o que subiu e o que não)
async function enviarDocsCriacao(inputId,idCli,idTar){
  const inp=ge(inputId);const fs=inp&&inp.files?Array.from(inp.files):[];
  if(!fs.length)return;
  let ok=0;const falhas=[];
  for(const f of fs){
    if(f.size>25*1024*1024){falhas.push(f.name+" (mais de 25 MB)");continue;}
    try{await DB.docEnviar(f,idCli,idTar);ok++;}
    catch(e){falhas.push(f.name+" ("+e.message+")");}}
  if(ok)toast(ok+" documento(s) anexado(s) à tarefa.","ok");
  if(falhas.length)toast("Não anexado(s): "+falhas.join("; "),"erro");
}

  const chk=ge("nc-chk").value;const rev=new Date();if(!["IMEDIATO","DIÁRIO"].includes(chk))rev.setDate(rev.getDate()+7);

    <span><b>${esc(c.nome)}</b> ${c.situacao==="PROSPECCAO"?'<span class="tag td2">PROSP</span>':""} <span style="color:var(--gray);font-size:11px">${esc(c.cnpj_cpf||"")}</span></span></div>`).join("")
    ||`<div style="font-size:12px;color:var(--gray)">Nenhum. Marque "cliente novo" se for prospecção.</div>`;
}
function selPrCli(id){E._prCli=E._cli[id];ge("pr-res").innerHTML="";ge("pr-q").value=E._prCli.nome;
  ge("pr-sel").textContent="✓ "+E._prCli.nome+" selecionado";ge("pr-novo").checked=false;ge("pr-novo-w").style.display="none";
  avisaPropDup();}
// conferência de duplicidade: propostas em aberto para o mesmo cliente
function propostasAbertasDe(nome,idc){
  const alvo=String(nome||"").trim().toUpperCase();
  return (E._props||[]).filter(p=>!["Aceita","Recusada"].includes(p.status)
    &&((idc&&p.id_cliente&&p.id_cliente===idc)
       ||(alvo&&String(p.cliente||"").trim().toUpperCase()===alvo)));}
function avisaPropDup(){
  const box=ge("pr-dup");if(!box)return;
  const novo=ge("pr-novo")&&ge("pr-novo").checked;
  const nome=novo?(ge("pr-nnome").value||""):(E._prCli?E._prCli.nome:"");
  const idc=(!novo&&E._prCli)?E._prCli.id_cliente:"";
  const dups=String(nome).trim().length>=3?propostasAbertasDe(nome,idc):[];
  box.innerHTML=dups.length?`<div style="background:#FDEBEC;border:1px solid #F5C2C7;border-radius:9px;padding:8px 12px;margin-top:6px;font-size:12px;color:#842029">
    <b>&#9888;&#65039; Já existe proposta em aberto para este cliente:</b>
    ${dups.map(p=>`<div style="margin-top:3px">• ${esc(p.status||"?")} em ${esc(p.data_proposta||"?")} — executou <b>${esc(p.executor||"?")}</b>, pediu ${esc(p.quem_pediu||"?")}</div>`).join("")}
    <div style="margin-top:4px">Confira com o colega antes de lançar de novo.</div></div>`:"";}
function numBR(s){s=String(s||"").trim();if(!s)return 0;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");return parseFloat(s)||0;}
function modoPagamento(){
  const r=document.querySelector('input[name="pr-modo"]:checked');
  return (r&&r.value)||"soma";
}
function somaProposta(){
  const modo=modoPagamento();
  let tot=0,maior=0;const opcoes=[];
  ["entrada","boleto","cartao","vista"].forEach(id=>{
    if(ge("pg-"+id)?.checked){const v=numBR(ge("pgv-"+id).value);tot+=v;if(v>maior)maior=v;
      if(v)opcoes.push("R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:2}));
      const x=ge("pgx-"+id);if(x&&ge("pgh-"+id)){const n=parseInt(x.value)||1;
        ge("pgh-"+id).textContent=(v&&n>1)?`= ${n}x de R$ ${(v/n).toLocaleString("pt-BR",{minimumFractionDigits:2})}`:"";}}});
  if(modo==="ou"){ge("pr-total").textContent=opcoes.length?opcoes.join("  OU  "):"—";return maior;}
  ge("pr-total").textContent="R$ "+tot.toLocaleString("pt-BR",{minimumFractionDigits:2});return tot;
}
async function lancarProposta(){
  const novo=ge("pr-novo").checked;
  let cliente="",idc="",cnpj="";
  if(novo){cliente=(ge("pr-nnome").value||"").trim();cnpj=(ge("pr-ncnpj").value||"").trim();
    if(!cliente){toast("Informe o nome do cliente novo.","erro");return;}}
  else{if(!E._prCli){toast("Selecione o cliente ou marque 'cliente novo'.","erro");return;}
    cliente=E._prCli.nome;idc=E._prCli.id_cliente;cnpj=E._prCli.cnpj_cpf||"";}
  const exec=ge("pr-exec").value;if(!exec){toast("Quem executa?","erro");return;}
  const pediu=ge("pr-pediu").value;if(!pediu){toast("Quem pediu?","erro");return;}
  const prods=[...document.querySelectorAll(".pr-prod:checked")].map(x=>x.value);
  if(!prods.length){toast("Marque ao menos um produto.","erro");return;}
  const verts=[...document.querySelectorAll(".pr-vert:checked")].map(x=>x.value);
  if(!verts.length){toast("Marque ao menos uma vertical.","erro");return;}
  const partes=[];let tot=0;
  const forma=(id,rot,temX)=>{if(!ge("pg-"+id).checked)return true;
    const v=numBR(ge("pgv-"+id).value);if(!v){toast("Informe o valor de "+rot+".","erro");return false;}
    tot+=v;const x=temX?parseInt(ge("pgx-"+id).value)||1:0;
    partes.push(`${rot}${x>1?" "+x+"x":""}: R$ ${v.toLocaleString("pt-BR",{minimumFractionDigits:2})}`);return true;};
  if(!forma("entrada","Entrada",0)||!forma("boleto","Boleto",1)||!forma("cartao","Cartão",1)||!forma("vista","À vista",0))return;
  if(!partes.length){toast("Marque ao menos uma forma de pagamento.","erro");return;}
  const modoPg=modoPagamento();
  let cond;
  if(modoPg==="ou"&&partes.length>1){
    // alternativas: nada soma — o valor de referência é a MAIOR opção
    tot=0;["entrada","boleto","cartao","vista"].forEach(id=>{
      if(ge("pg-"+id).checked){const v=numBR(ge("pgv-"+id).value);if(v>tot)tot=v;}});
    cond="OPÇÕES (cliente escolhe uma): "+partes.join("  OU  ");
  }else{
    cond=(partes.length>1?`Total R$ ${tot.toLocaleString("pt-BR",{minimumFractionDigits:2})} = `:"")+partes.join(" + ");
  }
  const orig=ge("pr-orig").value;if(!orig){toast("Informe a origem.","erro");return;}
  const cont=ge("pr-cont").value;if(!cont){toast("Como foi feita?","erro");return;}
  const par=ge("pr-par").value;if(!par){toast("Tipo de parecer?","erro");return;}
  const sp=(ge("pr-sp").value||"").trim();
  if(par==="Word"&&!sp){toast("Link do SharePoint é obrigatório para parecer em Word.","erro");return;}
  const tempo=0; // campo aposentado em 30/07/2026 (lançavam como follow-up geral, não da proposta)
  const dups=propostasAbertasDe(cliente,idc);
  if(dups.length&&!confirm("⚠️ Já existe proposta em aberto para "+cliente+
    " (executou "+(dups[0].executor||"?")+", status "+(dups[0].status||"?")+").\n\nLançar mesmo assim?"))return;
  try{const r=await DB.criarProposta({cliente,id_cliente:idc,cnpj,novo_cliente:novo,
    executor:exec,quem_pediu:pediu,responsavel:pediu||exec,produtos:prods.join(", "),verticais:verts.join(", "),
    valor:tot,cond,origem:orig,contato:cont,parecer:par,sharepoint:sp,tempo,
    data:ge("pr-data").value||hojeISO(),obs:ge("pr-obs").value||"",status:"Proposta enviada"});
    toast("✓ Proposta lançada: "+r.id,"ok");}
  catch(e){toast("Erro: "+e.message,"erro");return;}
  fecharModal2();if(E.view==="prop")telaPropostas();
}
// ---- atividade avulsa (tempo geral: WhatsApp, e-mails...)
async function abrirAvulsa(){
  const desc=prompt("O que você vai fazer agora?\n\nEx: Retorno aos grupos de WhatsApp, organização de e-mails...");
  if(desc===null)return;const d=String(desc).trim();
  if(!d){toast("Escreva o que vai fazer.","erro");return;}
  try{await DB.sessaoIniciar({id_tarefa:"AVULSA",cliente:"⏱️ "+d,operacao:d});}
  catch(e){toast("Erro: "+e.message,"erro");return;}
  ligaChipAvulsa(d,Date.now());
  toast("Atividade iniciada! O tempo está contando no topo.","ok");
}
// 🎯 prospecção: relógio avulso já nomeado (conta no Diário/produtividade e
// alimenta o quadro "Prospecção da semana" das heads)
async function iniciarProspeccao(){
  try{await DB.sessaoIniciar({id_tarefa:"AVULSA",cliente:"⏱️ 🎯 Prospecção",operacao:"🎯 Prospecção"});}
  catch(e){toast("Erro: "+e.message,"erro");return;}
  ligaChipAvulsa("🎯 Prospecção",Date.now());
  toast("Prospecção valendo — o relógio está contando no topo.","ok");
}
function ligaChipAvulsa(desc,iniMs){
  E._avulsa={desc,ini:iniMs};
  ge("chip-timer").style.display="inline-flex";
  ge("chip-timer-desc").textContent=desc.slice(0,26);
  clearInterval(E._avulsaInt);
  E._prosLimite=null;E._fuLimite=null;
  if(desc.indexOf("🎯 Prospecção")>-1)armarLimiteProspeccao();
  if(desc.indexOf("📞 Follow-up")>-1)armarLimiteFollowup();
  E._avulsaInt=setInterval(()=>{const s=Math.floor((Date.now()-E._avulsa.ini)/1000);
    ge("chip-timer-num").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
    // janela do dia esgotada: chama a pessoa de volta às pendentes
    const L=E._prosLimite;
    if(L&&!L.avisado&&Date.now()>=L.fimMs){L.avisado=true;mostrarFimProspeccao();}
    const F=E._fuLimite;
    if(F&&!F.avisado&&Date.now()>=F.fimMs){F.avisado=true;mostrarFimFollowup();}},1000);
}
// 📞 follow-up: relógio avulso nomeado + despertador da janela do dia
async function iniciarFollowup(){
  try{await DB.sessaoIniciar({id_tarefa:"AVULSA",cliente:"⏱️ 📞 Follow-up propostas",operacao:"📞 Follow-up propostas"});}
  catch(e){toast("Erro: "+e.message,"erro");return;}
  E._fuRodadasSessao=0;
  ligaChipAvulsa("📞 Follow-up propostas",Date.now());
  toast("Follow-up valendo — o relógio está contando no topo.","ok");
}
async function armarLimiteFollowup(){
  const base=FOLLOWUP[E.perfil.nome_sistema]||0;if(!base||!E._avulsa)return;
  let cart=0;
  try{cart=minhasNaRua(await DB.propostas(),E.perfil.nome_sistema).length;}catch(e){}
  const janela=fuEfetivo(base,cart);
  let usados=0;
  try{const hist=await DB.historicoPeriodo(1),hj=hojeISO();
    (hist||[]).forEach(r=>{if(String(r.data_dt||"").slice(0,10)!==hj)return;
      if(!ehMeuNome(r.autor))return;const tx=String(r.texto||"");
      if(tx.indexOf("📞 Follow-up")===-1)return;
      const m=tx.match(/Tempo registrado:\s*(\d+)\s*min/);if(m)usados+=parseInt(m[1]);});}
  catch(e){/* sem leitura do histórico, vale a janela cheia da sessão */}
  if(!E._avulsa)return;
  E._fuLimite={fimMs:E._avulsa.ini+Math.max(1,janela-usados)*60000,avisado:false,janela};
}
function mostrarFimFollowup(){
  let b=document.getElementById("fim-fu");
  if(!b){b=ce("div");b.id="fim-fu";
    b.style.cssText="position:fixed;inset:0;z-index:600;background:rgba(26,46,56,.85);display:flex;align-items:center;justify-content:center;padding:20px";
    document.body.appendChild(b);}
  const L=E._fuLimite||{janela:0};
  b.innerHTML=`<div style="background:white;border-radius:18px;padding:32px 30px;max-width:440px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.4)">
    <div style="font-size:44px;margin-bottom:8px">&#128222;</div>
    <div style="font-size:18px;font-weight:700;color:var(--navy);margin-bottom:6px">Tempo de follow-up do dia completo!</div>
    <div style="font-size:13px;color:var(--gray);margin-bottom:16px">Você usou os ${fmtMin(L.janela)} da sua janela de hoje. As rodadas ficaram registradas — agora é hora de voltar para as tarefas do dia.</div>
    <button class="btn btp btw" style="font-size:15px;padding:12px" onclick="fimFollowupOk()">&#10003; Encerrar follow-up e voltar às tarefas</button>
    <div style="margin-top:10px"><a href="javascript:adiarFimFollowup()" style="font-size:12px;color:var(--gray)">Estou finalizando um contato — me lembre em 10 min</a></div></div>`;}
async function fimFollowupOk(){
  const b=document.getElementById("fim-fu");if(b)b.remove();
  await pararAvulsa();}
function adiarFimFollowup(){
  const b=document.getElementById("fim-fu");if(b)b.remove();
  if(E._fuLimite){E._fuLimite.avisado=false;E._fuLimite.fimMs=Date.now()+10*60000;}}
// soma o que a pessoa JÁ prospectou hoje (sessões anteriores contam — parar e
// religar o relógio não zera a janela) e arma o despertador para o que resta
async function armarLimiteProspeccao(){
  const janela=PROSPEC[E.perfil.nome_sistema]||0;if(!janela||!E._avulsa)return;
  let usados=0;
  try{const hist=await DB.historicoPeriodo(1),hj=hojeISO();
    (hist||[]).forEach(r=>{if(String(r.data_dt||"").slice(0,10)!==hj)return;
      if(!ehMeuNome(r.autor))return;const tx=String(r.texto||"");
      if(tx.indexOf("🎯 Prospecção")===-1)return;
      const m=tx.match(/Tempo registrado:\s*(\d+)\s*min/);if(m)usados+=parseInt(m[1]);});}
  catch(e){/* sem leitura do histórico, vale a janela cheia da sessão */}
  if(!E._avulsa)return;   // pessoa parou o relógio enquanto o histórico carregava
  const resta=Math.max(1,janela-usados);
  E._prosLimite={fimMs:E._avulsa.ini+resta*60000,avisado:false,janela};
}
function mostrarFimProspeccao(){
  let b=document.getElementById("fim-pros");
  if(!b){b=ce("div");b.id="fim-pros";
    b.style.cssText="position:fixed;inset:0;z-index:600;background:rgba(26,46,56,.85);display:flex;align-items:center;justify-content:center;padding:20px";
    document.body.appendChild(b);}
  const L=E._prosLimite||{janela:0};
  b.innerHTML=`<div style="background:white;border-radius:18px;padding:32px 30px;max-width:440px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.4)">
    <div style="font-size:44px;margin-bottom:8px">&#127919;</div>
    <div style="font-size:18px;font-weight:700;color:var(--navy);margin-bottom:6px">Tempo de prospecção do dia completo!</div>
    <div style="font-size:13px;color:var(--gray);margin-bottom:16px">Você usou os ${fmtMin(L.janela)} da sua janela de hoje. O tempo fica registrado na sua produtividade — agora é hora de voltar para as tarefas pendentes.</div>
    <button class="btn btp btw" style="font-size:15px;padding:12px" onclick="fimProspeccaoOk()">&#10003; Encerrar prospecção e voltar às tarefas</button>
    <div style="margin-top:10px"><a href="javascript:adiarFimProspeccao()" style="font-size:12px;color:var(--gray)">Estou finalizando um contato — me lembre em 10 min</a></div></div>`;}
async function fimProspeccaoOk(){
  const b=document.getElementById("fim-pros");if(b)b.remove();
  await pararAvulsa();}
function adiarFimProspeccao(){
  const b=document.getElementById("fim-pros");if(b)b.remove();
  if(E._prosLimite){E._prosLimite.avisado=false;E._prosLimite.fimMs=Date.now()+10*60000;}}
async function pararAvulsa(extraNota){
  if(!E._avulsa)return;
  const desc=String(E._avulsa.desc||"");
  // relatório obrigatório para as heads (pedido da Bruna, 18/08/2026):
  // prospecção informa a BASE + resultado; follow-up sem rodada, justifica
  if(extraNota===undefined){
    if(desc.indexOf("🎯 Prospecção")>-1){abrirFechoProspeccao();return;}
    if(desc.indexOf("📞 Follow-up")>-1&&!(E._fuRodadasSessao>0)){abrirFechoFollowup();return;}
  }
  const min=Math.round((Date.now()-E._avulsa.ini)/60000);
  clearInterval(E._avulsaInt);E._prosLimite=null;E._fuLimite=null;ge("chip-timer").style.display="none";
  try{await DB.sessaoConcluir(min,"AVULSA");
    if(min>=1)await DB.nota({id_tarefa:"AVULSA",id_cliente:null,tipo:"TIMER",texto:`Tempo registrado: ${min} min — ⏱️ ${E._avulsa.desc}`});
    if(extraNota)await DB.nota({id_tarefa:"AVULSA",id_cliente:null,tipo:"HISTORICO",texto:extraNota});
    else if(desc.indexOf("📞 Follow-up")>-1&&E._fuRodadasSessao>0)
      await DB.nota({id_tarefa:"AVULSA",id_cliente:null,tipo:"HISTORICO",
        texto:`📞 Follow-up do dia: ${E._fuRodadasSessao} rodada(s) registrada(s) nas propostas.`});}
  catch(e){toast("Erro: "+e.message,"erro");}
  toast(`Atividade registrada: ${min} min.`,"ok");E._avulsa=null;E._fuRodadasSessao=0;marcarAtividade();
}
const BASES_PROSPECCAO=["Carteira Bruna","Carteira Danielly","Carteira Eduarda",
  "Clientes do Simples Nacional","Inadimplentes / execuções da região",
  "Indicação de clientes","Lista fria / externa","Outra (descreva no relato)"];
function abrirFechoProspeccao(){
  modal2("&#127919; Fechar a prospecção","O relatório do dia vai para as heads",`
    <div class="bloco-t">Em que base você prospectou? *</div>
    <select class="fsel" id="fp-base" style="width:100%"><option value="">— escolha —</option>
      ${BASES_PROSPECCAO.map(x=>`<option>${esc(x)}</option>`).join("")}</select>
    <div class="bloco-t" style="margin-top:9px">O que você conseguiu? *</div>
    <textarea class="fta" id="fp-rel" placeholder="Ex.: 12 contatos, 3 interessados, 1 reunião marcada para quinta"></textarea>
    <button class="btn btp btw" style="margin-top:8px" onclick="confirmarFechoProspeccao()">&#10003; Registrar relatório e parar o relógio</button>`);}
async function confirmarFechoProspeccao(){
  const b=ge("fp-base").value,r=(ge("fp-rel").value||"").trim();
  if(!b){toast("Diga em que base você prospectou.","erro");return;}
  if(!r){toast("Conte o que conseguiu — é o relatório que as heads acompanham.","erro");return;}
  fecharModal2();
  await pararAvulsa(`🎯 Prospecção — base: ${b} | ${r}`);}
function abrirFechoFollowup(){
  modal2("&#128222; Parar sem nenhuma rodada?","Nenhuma rodada foi registrada nesta sessão",`
    <div style="font-size:12px;color:var(--gray);margin-bottom:6px">O follow-up existe para registrar rodadas nas propostas. Se nenhuma saiu, explique para as heads:</div>
    <textarea class="fta" id="ff-just" placeholder="Ex.: liguei para 4 clientes e nenhum atendeu; reagendei os retornos"></textarea>
    <button class="btn btp btw" style="margin-top:8px" onclick="confirmarFechoFollowup()">Registrar justificativa e parar</button>
    <div style="text-align:center;margin-top:8px"><a href="javascript:fecharModal2()" style="font-size:12px;color:var(--gray)">voltar e registrar uma rodada</a></div>`);}
async function confirmarFechoFollowup(){
  const j=(ge("ff-just").value||"").trim();
  if(!j){toast("Escreva a justificativa.","erro");return;}
  fecharModal2();
  await pararAvulsa(`📞 Follow-up encerrado sem rodada — justificativa: ${j}`);}
async function retomarSessaoAtiva(){
  try{const s=await DB.sessaoAtiva();
    if(s&&s.id_tarefa==="AVULSA"){const m=String(s.hora_inicio||"").match(/(\d{1,2}):(\d{2})/);
      let ini=Date.now();if(m){const d0=new Date();d0.setHours(+m[1],+m[2],0,0);if(d0.getTime()<=Date.now())ini=d0.getTime();}
      ligaChipAvulsa(String(s.operacao||s.cliente||"Atividade").replace(/^⏱️\s*/,""),ini);}}
  catch(e){}
}

iniciar();
